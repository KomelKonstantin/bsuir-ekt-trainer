q":"Назовите черты швейцарской модели","items":["федерализм и децентрализация","прямая демократия","автономия кантонов и коммун","малые и средние предприятия","высокая добавленная стоимость (машиностроение, химия-фарма, точные приборы, финансы)","дуальное профессиональное образование (практика + учёба)","соцстрахование рисков","«тормоз долга» — бюджетное правило, низкий госдолг","конкурентная налоговая система"]},{"q":"Назовите даты шведской модели","items":["до 1930-х индустриализация","1938 Сальтшёбаденское соглашение (LO и SAF, «классовый мир»)","≈1950–51 модель Рена–Мейднера","1960–80-е расцвет","1990-е кризис"]},{"q":"Назовите три элемента модели Рена–Мейднера","items":["солидарная политика зарплат","активная политика занятости","ограничительная макрополитика"]},{"q":"Назовите корректные названия шведской модели","items":["социально ориентированная рыночная экономика","социальное государство","скандинавская модель"]},{"q":"Назовите минусы шведской модели","items":["налоговая нагрузка","большой госсектор","дорогой труд","жильё","безработица"]}],"pairs":[["США","Китай","Либеральная рыночная, минимальное регулирование — социалистическая рыночная, руководство КПК и прямое вмешательство государства"],["США","Швейцария","Обе либеральные рыночные: США — минимальное регулирование, фондовый рынок, гибкий труд; Швейцария — ограниченная роль государства, федерализм, прямая демократия, долговой тормоз"],["Франция","Швеция","Франция — смешанная, дирижизм → рынок, государство как стратег и акционер, индикативное планирование; Швеция — социально ориентированная, высокие налоги и перераспределение, профсоюзы и коллективные договоры"],["Сингапур","Китай","Сингапур — авторитарный капитализм, сильное, технократическое государство, открытость, ТНК, борьба с коррупцией; Китай — социалистическая рыночная, ОЭЗ, экспорт, инвестиции"],["Швеция","социализм","Швеция: преобладает частная собственность, цены рыночные, планирование ограничено — это НЕ социализм"]],"chrono":[["Конституция США","1787",1787],["Основание Швейцарского федеративного государства","1848",1848],["Закон Шермана","1890",1890],["Основание КНР","1949",1949],["Дирижизм во Франции","1944–1973",1944],["Сальтшёбаденское соглашение","1938",1938],["«Новый курс» (США)","1935",1935],["Независимость Сингапура","1965",1965],["Medicare/Medicaid","1965",1965],["Реформы Дэн Сяопина","1978",1978],["Курс КНР на рыночную экономику","1992",1992],["ВТО — вступление Китая","2001",2001],["Додд–Франк","2010",2010],["Модель Рена–Мейднера (Швеция)","≈1950–51",1950]],"questions":[["Сальтшёбаден 1938?","Соглашение профсоюзов LO и работодателей SAF — «классовый мир» в Швеции."],["Чем шведская модель отличается от социализма?","Преобладает частная собственность, цены рыночные, планирование ограничено."],["Какой вывод о национальных моделях?","Нет единой универсальной модели для всех стран."]]},{"n":40,"title":"Формулы","section":"Шпаргалки","formulas":[["Эффективность","Эффективность = max результат / min затраты","Эффективность — это результат, делённый на затраты. Она тем выше, чем больше результат и чем меньше затраты. Пример: Один и тот же выпуск при меньших затратах — эффективнее."],["Эффективность потребления","Эффективность потребления = max TU / min TEx","TU (total utility) — общая полезность, которую человек получил от благ. TEx (total expenditure) — его общие расходы. Потребление эффективно, когда за минимум расходов получаем максимум полезности. Пример: Купить то же удовлетворение дешевле."],["Эффективность производства","Эффективность производства = max AP_L / min ATC","AP_L — средний продукт труда (сколько продукции даёт один работник). ATC — средние общие издержки на единицу продукции. Производство эффективно, когда выработка высокая, а издержки на единицу низкие. Пример: Новая технология: выработка выросла, издержки на штуку упали."],["Производительность труда (средний продукт труда)","AP_L = TP_L (Q) / L","Производительность труда равна общему продукту (объёму выпуска Q), делённому на число работников L. Пример: 50 изделий на 5 рабочих: AP = 10 изделий на человека."],["Средние общие издержки","ATC = TC / Q","Средние общие издержки — это все издержки TC, делённые на количество выпущенной продукции Q. То есть издержки на одну штуку. Пример: TC = 1500 руб., Q = 1000 булок: ATC = 1,5 руб."],["Предельные издержки","MC — предельные издержки (прирост TC от ещё одной единицы продукции)","Прирост общих издержек от выпуска ещё одной единицы. Пока MC меньше ATC, средние издержки падают; когда больше — растут. Поэтому MC пересекает ATC в её минимуме. Пример: Каждая следующая булка стоит дороже средней — средняя цена начинает расти."],["Общая выручка","TR = P × Q","Общая выручка равна цене P, умноженной на количество проданных единиц Q. Пример: 2 руб. × 1000 булок = 2000 руб."],["Средняя выручка","AR = TR / Q = P","Средняя выручка — это выручка на одну единицу. При заданной рынком цене она равна самой цене. Пример: 2000 / 1000 = 2 руб. = цена."],["Средняя прибыль","АП = AR − ATC","Средняя прибыль (с одной единицы) — это цена минус средние издержки на единицу. Пример: 2 − 1,5 = 0,5 руб. с булки."],["Общая прибыль","ТП = TR − TC","Общая прибыль — выручка минус общие издержки. Пример: 2000 − 1500 = 500 руб."],["Общая прибыль через среднюю","ТП = АП × Q","Общая прибыль равна прибыли с единицы, умноженной на число единиц. Пример: 0,5 × 1000 = 500 руб."],["Три ситуации TR и TC","TR > TC, TR = TC, TR < TC","Выручка больше издержек — экономическая прибыль (ТП > 0). Равна издержкам — нормальная прибыль (ТП = 0, все издержки покрыты, включая зарплату, процент и ренту). Меньше — убыток (ТП < 0). Пример: Нормальная прибыль — это не убыток."],["Норма амортизации","Норма амортизации = 1 / срок службы × 100%","Каждый год на готовый продукт переносится равная доля стоимости оборудования: единица, делённая на число лет службы, в процентах. Пример: 80 000 руб., 8 лет: 1/8 = 12,5% в год; амортизация = 80 000 × 12,5% = 10 000 руб. в год."],["Альтернативные издержки","Альт. издержки А = ΔБ (потеряно) / ΔА (получено)","Сколько единиц блага Б приходится отдать, чтобы получить одну единицу блага А: потерянное делим на полученное. Пример: Участок C→D: потеряно 3 тыс. роботов, получена 1 сотня тыс. пицц — «цена» пиццы 3 робота."],["Простой обмен","Т–Д–Т","Простой обмен: товар продаём за деньги и на деньги покупаем другой товар. Деньги — только посредник. Пример: Продал зерно, купил одежду."],["Движение капитала","Д–Т–Д′, где Д′ = Д + ΔД","Движение капитала: деньги вкладываем в товар и возвращаем больше денег. ΔД — прирост, прибавочная стоимость. Пример: Купил за 100, продал за 120: Д′ = 120, ΔД = 20."],["Ростовщический капитал","Д–Д′","Ростовщический капитал: деньги в долг и возвращаются с процентом, без участия товара. Пример: Дал в долг 100, вернули 110."],["Стоимость товара (Маркс)","W = c + v + m","Стоимость товара складывается из постоянного капитала c (станки, сырьё — переносят свою стоимость), переменного капитала v (зарплата — создаёт новую стоимость) и прибавочной стоимости m. Пример: Станки и сырьё 60, зарплата 20, прибавочная 20: стоимость = 100."],["Норма прибавочной стоимости (Маркс)","m′ = m / v","Норма прибавочной стоимости (норма эксплуатации) — прибавочная стоимость, делённая на переменный капитал. Показывает, сколько прибавочной стоимости приходится на каждую единицу зарплаты. Пример: Рабочий день 10 ч: 4 ч необходимые (v), 6 ч прибавочные (m): 6 / 4 = 150%."],["Совокупный спрос","AD = C + I + G + Nx","Совокупный спрос (совокупные расходы) складывается из потребительских расходов домохозяйств C, инвестиций бизнеса I, государственных расходов G и чистого экспорта Nx. Пример: Кто и на что тратит деньги в стране."],["Чистый экспорт","Nx = X − M","Чистый экспорт — это экспорт минус импорт. Пример: Продали за границу 80, купили 70: Nx = 10."],["Выпуск (ВВП) по расходам","Y = C + I + G + (X − M)","Выпуск (ВВП) по расходам равен сумме тех же компонентов. То, что произведено, равно тому, что куплено. Пример: Тот же AD, записанный для ВВП."],["Мультипликатор (Кейнс)","Мультипликатор M = 1 / (1 − MPC) = 1 / MPS","Во сколько раз общий прирост дохода больше первоначального расхода. MPC — предельная склонность к потреблению (какую долю нового дохода тратят), MPS = 1 − MPC — предельная склонность к сбережению. Пример: MPC = 0,8: M = 1 / 0,2 = 5. Расход 10 даёт прирост дохода 50."],["Реальный ВВП","Реальный ВВП = номинальный / дефлятор","Номинальный ВВП в текущих ценах делим на индекс цен (дефлятор), чтобы убрать влияние роста цен. Пример: Если цены выросли вдвое, реальный ВВП вдвое меньше номинального."],["Рост по Харроду–Домару","G = S / V (Харрод–Домар)","Темп роста дохода G равен средней склонности к сбережению S (какая доля дохода сберегается), делённой на капиталоёмкость V (сколько капитала нужно на единицу дохода). Чем больше копим и чем эффективнее используем капитал, тем быстрее растём. Пример: S = 20%, V = 4: G = 5% в год."],["Идеал неокейнсианцев","Gw = Gn","Идеал неокейнсианцев: гарантированный темп роста (тот, что обеспечивают сбережения и капитал) равен естественному (потенциальному) темпу. Пример: Экономика растёт ровно настолько, насколько позволяют ресурсы."],["Уравнение обмена (Фишер, монетаризм)","M · V = P · Q (Фишер)","Денежная масса M, умноженная на скорость обращения V (сколько раз в год деньга переходит из рук в руки), равна уровню цен P, умноженному на объём продаж Q. Если денег больше, чем товаров, растут цены. Пример: Основа монетаризма: инфляция — монетарное явление."],["Темп инфляции","π = (P₁ − P₀) / P₀ × 100%","Темп инфляции — это на сколько процентов цены в конце периода P₁ выше, чем в начале P₀. Пример: Было 100, стало 105: π = 5%."],["Правило 70","Годы удвоения цен ≈ 70 / π (π — годовой темп инфляции, %)","Число лет, за которое цены удваиваются, примерно равно 70, делённым на годовой темп инфляции в процентах. Пример: Инфляция 5% в год: цены удвоятся за 14 лет."],["Рациональные ожидания","E(X) = X + ошибка (средняя ошибка = 0)","Ожидаемое значение равно фактическому плюс случайная ошибка, которая в среднем равна нулю. Люди в среднем не ошибаются систематически. Пример: Основа рациональных ожиданий."],["Кругооборот: издержки и доходы","C = I","Издержки фирм равны доходам домохозяйств: то, что фирма платит за ресурсы, для семьи является зарплатой, процентом, рентой и прибылью. Пример: Расход одного — доход другого."],["Кругооборот: равновесие","S + T + M = I + G + X","Утечки из кругооборота (сбережения, налоги, импорт) равны инъекциям в него (инвестиции, госрасходы, экспорт). В равновесии деньги уходят и приходят в равном объёме. Пример: Сколько вывели из потока, столько и добавили."],["Показатели TP, AP, MP","TP, AP, MP","TP — общий продукт (весь выпуск). AP — средний продукт (выпуск на одного работника). MP — предельный продукт (прирост выпуска от одного дополнительного работника). Пример: Общий, средний, предельный — три разных «уровня» одного и того же."],["Показатели TC, ATC, MC","TC, ATC, MC","TC — общие издержки, ATC — на единицу в среднем, MC — на ещё одну единицу. Пример: Аналогично: общий, средний, предельный."],["Показатели TR, AR","TR, AR","TR — вся выручка, AR — выручка на единицу (равна цене)."]]},{"n":41,"title":"Кто что написал","section":"Шпаргалки","authors":[["Т. Ман","«Богатство Англии во внешней торговле»; торговый баланс (1621, 1630)","Меркантилизм"],["А. Монкретьен","«Трактат о политической экономии» (термин) (1615)","Меркантилизм"],["Ф. Кенэ","«Экономическая таблица»; чистый продукт — только земля (1758)","Физиократия"],["У. Петти","«Политическая арифметика»; труд — отец богатства (изд. 1690)","Классическая политэкономия"],["П. Буагильбер","«Подробное описание положения Франции», «Обвинение Франции» (1696, 1707)","Классическая политэкономия"],["А. Смит","«Богатство народов»; невидимая рука, разделение труда (1776)","Классическая политэкономия"],["Д. Рикардо","«Начала политэкономии и налогового обложения»; сравнительные преимущества, рента (1817)","Классическая политэкономия"],["К. Маркс","«Капитал»; прибавочная стоимость (1867)","Марксизм"],["К. Менгер","«Основания политической экономии» (австрийская школа) (1871)","Австрийская школа"],["А. Маршалл","«Принципы экономической науки»; «ножницы» спроса и предложения (1890)","Неоклассика"],["Т. Веблен","«Теория праздного класса»; демонстративное потребление (1899)","Институционализм"],["Дж. М. Кейнс","«Общая теория занятости, процента и денег» (1936)","Кейнсианство"],["Р. Коуз","«Природа фирмы»; трансакционные издержки (1937)","Институционализм"],["Дж. К. Гэлбрейт","«Новое индустриальное общество»; техноструктура (1967)","Институционализм"],["Д. Белл","«Грядущее постиндустриальное общество» (1973)","Постиндустриальное общество"]]},{"n":42,"title":"Пары, которые путают","section":"Шпаргалки","pairs":[["Смит","Рикардо","Смит — абсолютные преимущества, невидимая рука; Рикардо — сравнительные преимущества, дифференциальная рента"],["Ранний меркантилизм","Поздний меркантилизм","Ранний — деньги, бульонизм, запреты; поздний — торговый баланс, мануфактуры"],["Петти","Буагильбер","Петти — основа промышленность, деньги важны; Буагильбер — сельское хозяйство, деньги «палач»"],["Кейнсианство","Неокейнсианство","Кейнс — выход из кризиса, фискальная политика; нео — долгосрочный рост (Харрод–Домар), плюс монетарная политика"],["Монетаризм","Экономический консерватизм","Монетаризм — деньги и MV = PQ; консерватизм — налоги и предложение (Лаффер)"],["Монетаризм","Рациональные ожидания","Монетаризм — деньги и MV = PQ; рациональные ожидания — ожидания агентов (Лукас)"],["Экономический консерватизм","Рациональные ожидания","Консерватизм — налоги и предложение (Лаффер); рациональные ожидания — ожидания агентов (Лукас)"],["Адаптивные ожидания","Рациональные ожидания","Адаптивные — по прошлому; рациональные — по всей информации и будущему"],["Старый институционализм","Новый институционализм","Старый — критика капитализма (Веблен); новый — издержки и контракты (Коуз, Норт)"],["Частичное равновесие","Общее равновесие","Частичное — Маршалл (один рынок); общее — Вальрас"],["Объект ЭкТ","Предмет ЭкТ","Объект — вся экономика; предмет — эффективное использование редких ресурсов"],["Прямая связь","Обратная связь","Прямая — производим то, что нужно (рынок); обратная — потребляем то, что произведено (план)"]]},{"n":43,"title":"Национальные модели и типы общества","section":"Шпаргалки","cards":[["США","Либеральная: рынок, фондовый рынок, гибкий труд, адресная соцпомощь","Национальные модели"],["Китай","Социалистическая рыночная: руководство КПК, ОЭЗ, экспорт; реформы Дэна, 1978","Национальные модели"],["Франция","Дирижизм → «государство-стратег»; приватизации, 35-часовая неделя, соцзащита","Национальные модели"],["Сингапур","Авторитарный капитализм Ли Куан Ю: открытость, ТНК, борьба с коррупцией, образование","Национальные модели"],["Швейцария","Федерализм и прямая демократия, финансы и точная промышленность, «тормоз долга»","Национальные модели"],["Швеция","Рынок + высокие налоги + соцзащита + профсоюзы; НЕ социализм","Национальные модели"],["Индустриальное общество","Капитал, машинное производство, промышленность (термин: Сен-Симон)","Типы общества"],["Постиндустриальное общество","Услуги и знания (Белл, 1973): пять измерений, промышленность не исчезает","Типы общества"]],"lists":[{"q":"Назовите все национальные модели экономики","items":["США","Китай","Франция","Сингапур","Швейцария","Швеция"]},{"q":"Назовите пять измерений постиндустриального общества (Белл)","items":["Экономика — от товаров к услугам","Преобладание профессионально-технического класса","Осевой принцип — центральность теоретического знания","Ориентация на будущее (оценка и контроль технологий)","«Интеллектуальная технология» — принятие решений через моделирование и системный анализ"]}],"pairs":[["Индустриальное общество","Постиндустриальное общество","Индустриальное — капитал, машинное производство, промышленность (термин: Сен-Симон); постиндустриальное — услуги и знания (Белл, 1973): пять измерений, промышленность не исчезает"]]},{"n":44,"title":"Списки «назови все»","section":"Шпаргалки","lists":[{"q":"Назовите все: функции ЭкТ","items":["Познавательная","Прагматическая","Критическая","Прогностическая","Мировоззренческая","Идеологическая"]},{"q":"Назовите все: уровни познавательной функции","items":["Эмпирический","Теоретический","Нормативный","Практический"]},{"q":"Назовите все: методы познания","items":["Диалектический","Научная абстракция","Восхождение","Исторический","Логический","Общественная практика"]},{"q":"Назовите все: стадии воспроизводства","items":["Производство","Распределение","Обмен","Потребление"]},{"q":"Назовите все: факторы производства и их доходы","items":["Земля → рента","Труд → зарплата","Капитал → процент","Предпринимательство → прибыль"]},{"q":"Назовите все: характеристики предпринимательской деятельности","items":["Организация","Решения + ответственность","Инновации","Риск"]},{"q":"Назовите все: допущения модели КПВ","items":["Идеальная экономика","Статичная экономика","2 товара"]},{"q":"Назовите все: субъекты экономики","items":["Домашние хозяйства","Фирмы","Государство"]}]},{"n":45,"title":"Частые ловушки и самопроверка","section":"Шпаргалки","cards":[["Положение точки относительно КПВ","Внутри — неэффективно, на кривой — эффективно, снаружи — недостижимо","Ловушки"]],"pairs":[["Объект","Предмет","Объект — вся экономика, предмет — сторона, которую изучает наука (эффективное использование редких ресурсов)"],["Прямая связь","Обратная связь","Прямая = рынок (производим то, что нужно), обратная = план (потребляем то, что произвели)"],["Нормальная прибыль","Убыток","Нормальная прибыль — не убыток: ТП = 0, все издержки (в том числе зарплата, процент, рента) покрыты"],["Комплементы","Субституты","Комплементы: цена одного ↑ → спрос на оба ↓. Субституты: цена одного ↑ → спрос на другое ↑"],["Кризис (сдвиг КПВ)","Экономический рост (сдвиг КПВ)","Кризис сдвигает КПВ внутрь целиком (меньше и А, и Б), рост — наружу (больше и А, и Б)"],["Движение по КПВ","Экономический рост","Движение по кривой — это выбор, а не рост"],["Ресурсы","Факторы производства","Ресурс — запас, фактор — ресурс, уже работающий в производстве"]],"questions":[["Назови три школы и фазу цикла, которую описывает каждая.","Каждая школа появилась как ответ на свою фазу цикла. Классика описывает пик: главный регулятор — рынок, производство равно потреблению, доходы высокие, ресурсы заняты полностью. Кейнсианство описывает дно (кризис): основной регулятор — государство, доходы падают, ресурсы не заняты. Институционализм делает ставку на социальный контроль. Раздел конспекта: 0."],["Чем объект науки отличается от предмета? Что такое категория и закон?","Объект — явление или процесс, который подвергается анализу; предмет — сторона, характеристика объекта. У ЭкТ объект — экономика (сфера жизнедеятельности людей, связанная с производством и потреблением экономических благ). Категория — логическое понятие, отражающее сущность явления. Закон — объективная (не зависит от воли субъекта), причинно-следственная, типичная, повторяющаяся, сущностная связь между явлениями. Раздел конспекта: I.1, I.2."],["Нарисуй схему стадий воспроизводства и объясни прямую и обратную связь.","Четыре стадии: производство → распределение → обмен → потребление. Распределение — определение вклада каждого участника в создание блага; обмен — передача блага от одного субъекта к другому, с деньгами (Т_1–Д–Т_2) или без них (бартер, Т_1–Т_2); потребление — удовлетворение материальных потребностей. Прямая связь: производим то, что нужно потребителю (рыночная и смешанная экономика). Обратная: потребляем то, что произведено (плановая и традиционная экономика). Раздел конспекта: I.1."],["Два подхода к предмету ЭкТ; три точки зрения внутри первого.","Организационно-экономический критерий: ЭкТ изучает, какие из редких ресурсов общество выбирает для производства и распределения ради потребления сейчас и в будущем. С точки зрения производства — проблему эффективного использования редких ресурсов для максимального удовлетворения материальных потребностей; потребления — богатство нации; обмена — денежные сделки. Социально-экономический критерий: ЭкТ изучает экономические отношения между людьми в процессе производства и потребления и законы, которые их регулируют. Раздел конспекта: I.2."],["Перечисли 6 функций ЭкТ и 4 уровня познавательной.","Функции: познавательная, прагматическая (тактика и стратегия), критическая (анализ позитивных и негативных сторон развития экономики), прогностическая (прогнозы на основе текущего состояния), мировоззренческая (взгляд человека на экономику и своё место в производстве), идеологическая (выражает интересы социальной группы: политэкономия — буржуазии, марксизм — пролетариата). Уровни познавательной: эмпирический (факты), теоретический (общие законы), нормативный (законы и нормы права, например налоговая система), практический (тактика на сегодня, стратегия на будущее). Раздел конспекта: I.2."],["Почему монополия — пример негатива, а госмонополия в ЖКХ — нет? Границы монопольной цены?","Негативное — отношения, не соответствующие уровню производства. Монополия: одна фирма контролирует рынок сбыта, для потребителя нет свободы выбора и цена высокая. Государственная монополия в ЖКХ негативом не считается. Границы монопольной цены: верхняя — платёжеспособный спрос, нижняя — издержки на единицу продукции (ATC). Раздел конспекта: I.2."],["Разбери инфляцию диалектическим методом: сущность → причины → последствия.","Сущность: обесценивание денежной единицы, выраженное в росте уровня цен. Причины: монопольное право государства на эмиссию, фирмы-монополисты, профсоюзы. Последствия: выгодна государству, теряют получатели фиксированных доходов (бюджетники, пенсионеры, инвалиды), бизнес зависит от соотношения роста дохода и инфляции. Раздел конспекта: I.3."],["6 методов познания и результат каждого; недостаток исторического.","Диалектический — явления в развитии и взаимосвязи. Научная абстракция — отбрасываем частное, ищем сущностное; результат — система категорий. Восхождение от конкретного к абстрактному и обратно (пример: «Капитал» Маркса). Исторический — явления в последовательности их возникновения; недостаток — обилие описательного материала. Логический — анализ, синтез, индукция, дедукция; результат — формулировка законов. Общественная практика — познание начинается с практики и ею завершается, она подтверждает теоретические абстракции. Раздел конспекта: I.3."],["Классификация потребностей (4 признака) и закон возвышения.","По субъекту (индивидуальные, групповые, общественные); по характеру (материальные, духовные, социальные); по важности (первичные и вторичные); по удовлетворению (потенциальные и платёжеспособные). Закон возвышения потребностей: с ростом производства и общества потребности растут количественно и качественно; удовлетворение низших порождает высшие (пирамида Маслоу), а производство создаёт новые потребности, которые стимулируют производство. Раздел конспекта: II.1."],["Основной vs оборотный капитал; моральный износ I и II рода.","Основной капитал участвует во многих циклах и переносит стоимость частями (здания, станки). Оборотный — один цикл, стоимость сразу и полностью (сырьё, топливо). Моральный износ — обесценение из-за появления более дешёвых аналогов (I рода) или более производительных (II рода). Физический износ — потеря свойств из-за эксплуатации. Раздел конспекта: II.1."],["Задача: оборудование за 80 000 руб., срок 8 лет. Норма и годовая амортизация?","Норма амортизации = 1 / срок службы × 100% = 1/8 = 12,5% в год; годовая амортизация = 80 000 × 12,5% = 10 000 руб. Раздел конспекта: II.1."],["Как НИОКР увеличивают прибыль? Выпиши цепочку и формулы АП и ТП.","Цепочка: НИОКР → растёт производительность труда → растёт выпуск TP и падают средние издержки ATC → максимальная общая прибыль. Формулы: АП = AR − ATC; ТП = TR − TC = АП × Q. Цена задана рынком, поэтому прибыль растёт только через снижение ATC и рост Q. Раздел конспекта: II.2."],["Три ситуации TR / TC; что такое нормальная прибыль.","TR > TC → ТП > 0: экономическая прибыль. TR = TC → ТП = 0: нормальная прибыль — это не убыток, выручка покрывает все издержки, включая зарплату, процент и ренту. TR < TC → ТП < 0: убыток. Выход из ситуаций 2 и 3 — высокие технологии. Раздел конспекта: II.2."],["Три вопроса экономики и как их решают рынок и командная система.","ЧТО производить: в рынке и смешанной экономике — эффективное распределение редких ресурсов; в командной системе регулятор — план, распределение неэффективно. КАК производить: выбор технологии (сочетания трудовых и материальных ресурсов); эффективно при совершенной конкуренции, неэффективно при монополистической конкуренции, олигополии и монополии. ДЛЯ КОГО производить: потребление зависит от дохода, а доход — от количества и качества предлагаемых ресурсов; дети, пенсионеры и инвалиды выпадают из числа получателей доходов (проблема социальной справедливости). Командная система даёт уравнительность и деградацию, смешанная решает проблему перераспределением через налоги, пенсии и пособия. Раздел конспекта: II.3."],["По таблице A–E построй КПВ и объясни, почему она выгнута наружу. Почему A и E неприемлемы?","Таблица: пицца 0, 1, 2, 3, 4; роботы 10, 9, 7, 4, 0. Альтернативные издержки +1 пиццы: −1, −2, −3, −4 робота. Выпуклость — закон возрастающих альтернативных издержек: чем больше производим А, тем больше теряем Б за каждую следующую единицу; причина — ресурсы качественно неоднородны, это несовершенные заменители. A неприемлема: отказ от потребления в настоящем. E нереальна: нет средств производства на будущее. Раздел конспекта: II.4."],["Что сдвигает КПВ внутрь и наружу? Три типа экономического роста.","Неидеальная экономика (безработица, незанятые мощности, неэффективность) сдвигает кривую внутрь: падает ВВП, спад, дно, кризис, сокращаются и А, и Б. Рост сдвигает кривую наружу: больше и А, и Б. Типы роста: экстенсивный (больше ресурсов), интенсивный (лучше ресурсы), смешанный. Раздел конспекта: II.4."],["Функции домашних хозяйств, фирм и государства.","Домашние хозяйства потребляют блага, они собственники ресурсов и получают доходы. Фирмы создают и реализуют блага ради максимальной прибыли, покупают ресурсы и платят доходы. Государство выполняет правовую функцию (защита собственников от экспроприации) и экономическую (само предпринимает, создаёт инфраструктуру: финансовую, кредитно-денежную, транспортную, коммуникационную). Раздел конспекта: III.1."],["Нарисуй кругооборот и расшифруй L, K, C, x, y, R, I, E_x, G, T_F, T_I.","Фирмы и домохозяйства обмениваются через два рынка, ресурсов и благ. Вещественный поток: ресурсы L, K идут фирмам, товары x, y — домохозяйствам. Денежный поток: доходы I идут домохозяйствам, расходы E_x — фирмам как выручка R. Издержки фирм C равны доходам домохозяйств I. I — потребительские доходы (w, П_n, i, r), E_x — потребительские расходы, G — госрасходы, T_F — налог на прибыль фирм, T_I — подоходный налог, x_G и y_G — товары, которые покупает государство. Раздел конспекта: III.1."]]},{"n":46,"title":"Блиц-вопросы и устный опрос","section":"Шпаргалки","cards":[["Эволюция школ (ключевой вывод)","Меркантилизм (торговля) → физиократия (земля) → классика (труд, производство) → марксизм / маржинализм / австрийцы / историческая школа → неоклассика → кейнсианство → монетаризм, рац. ожидания, консерватизм → институционализм.","выводы"],["Два полюса экономической мысли","Колебание между «рынок саморегулируется» (Смит, Маршалл, Фридман, Хайек) и «нужно государство» (Кейнс, немецкая школа, Франция, Швеция).","выводы"],["Универсальная модель","Нет единой универсальной модели для всех стран.","выводы"]],"questions":[["Назови последовательность школ экономической мысли от меркантилизма до институционализма и объект внимания каждой на первых этапах.","Меркантилизм (торговля) → физиократия (земля) → классика (труд, производство) → марксизм / маржинализм / австрийцы / историческая школа → неоклассика → кейнсианство → монетаризм, рациональные ожидания, консерватизм → институционализм."],["Между какими двумя позициями колеблется история экономической мысли?","Между «рынок саморегулируется» (Смит, Маршалл, Фридман, Хайек) и «нужно государство» (Кейнс, немецкая школа, Франция, Швеция). Единой универсальной модели для всех стран нет."],["Что такое меркантилизм, что он считал богатством и каковы его предпосылки?","Меркантилизм (XVI–XVIII вв.) — не единая наука, а практические рекомендации купцов и чиновников (памфлеты). Богатство нации — золото и серебро. Предпосылки: распад феодализма, Великие географические открытия («революция цен»), мировой рынок, абсолютизм."],["Каковы черты меркантилизма?","Предмет — торговля, а не производство; активное вмешательство государства; протекционизм."],["Кто такой Т. Ман и что он предложил? Что такое бульонизм?","Т. Ман (поздний меркантилизм, XVII в.): торговый баланс — экспорт больше импорта ⇒ денежный фонд; вывоз готовых товаров, мануфактуры. Бульонизм (У. Стаффорд) — ранний меркантилизм (XVI в.): денежная система, запрет вывоза денег и золота, высокие пошлины."],["Какие меры меркантилистской политики были в Англии и Франции?","Англия: Навигационный акт Кромвеля (1651) против Голландии; Ост-Индская компания; «Богатство Англии во внешней торговле» (1630). Франция: Монкретьен (1615) ввёл термин «политическая экономия», Кольбер — кольбертизм."],["Что считали источником богатства физиократы и что такое «чистый продукт»?","Только землю и сельское хозяйство: они дают «чистый продукт» (излишек над затратами). Промышленность и торговля «стерильны», только перераспределяют."],["Какие идеи выдвинули физиократы (1750–1789)?","«Природный порядок» — вечные объективные законы; невмешательство государства («laissez faire»); единый налог на землю. Кенэ — «Экономическая таблица» (1758); Тюрго — свобода торговли и реформы, вызвавшие сопротивление дворянства."],["Какие три класса выделяли физиократы?","Производительный (крестьяне), собственники земли, непроизводительный (ремесленники, торговцы)."],["Что стало с физиократией и чем она важна?","Школа упала после революции 1789; она стала фундаментом для Смита и Рикардо."],["Какой сдвиг в экономической мысли связан с Петти и Буагильбером?","Смена фокуса с обращения на производство (зарождение классики)."],["Что сказал и сделал Петти (1623–1687, Англия)?","«Труд — отец богатства, земля — его мать»; «цена естественная» (стоимость) и «цена политическая» (рыночная); зарплата — физиологический минимум; рента — излишек над издержками; «политическая арифметика» — предшественник статистики; деньги ≈ 3% богатства."],["Как Буагильбер (1646–1714, Франция) смотрел на богатство и деньги? Чем он отличается от Петти?","«Адвокат крестьянства»: богатство — масса материальных благ (сельхоз), деньги — «палач», стоимость измеряется рабочим временем, свобода торговли зерном, реформа налогов (талья). Различие: основа экономики у Петти — промышленность, у Буагильбера — сельское хозяйство."],["Какие основные идеи Адама Смита (1723–1790)?","«Богатство народов» (1776); разделение труда; трудовая теория стоимости; три фактора и доходы: земля — рента, труд — зарплата, капитал — прибыль; «невидимая рука»; государство — «ночной сторож» (защита прав, оборона, общественные блага); свободная торговля; теория абсолютных преимуществ."],["Что понимал Смит под ролью государства?","Государство — «ночной сторож»: защита прав, оборона, общественные блага; свободная торговля."],["Что изучает Рикардо и как называется его главный труд?","«Начала политической экономии и налогового обложения» (1817). Предмет — законы распределения доходов между рентой, прибылью и зарплатой."],["Какая фраза Рикардо о ренте и хлебе?","«Не потому хлеб дорог, что платится рента, а рента платится потому, что хлеб дорог»."],["Какие законы и идеи у Рикардо, кроме дифференциальной ренты?","Стоимость определяется трудом (живым и овеществлённым); закон убывающей доходности; «железный закон» зарплаты (минимум на содержание семьи); норма прибыли склонна к снижению; золотой стандарт; эквивалентность Рикардо–Барро; борьба с «хлебными законами»."],["Какой пример приводит Рикардо для сравнительных преимуществ и чем эта теория важна?","Английское сукно и португальское вино: специализация выгодна и без абсолютных преимуществ. Это основа ВТО."],["Назови три источника марксизма.","Немецкая философия (Гегель, Фейербах), английская политэкономия (Смит, Рикардо), французский утопический социализм (Сен-Симон, Фурье)."],["Что такое базис и надстройка? Назови пять формаций по Марксу.","Производительные силы и производственные отношения образуют базис, он определяет надстройку (государство, право, идеология). Формации: первобытная, рабовладельческая, феодальная, капиталистическая, коммунистическая."],["Две стороны товара по Марксу.","Потребительная стоимость (конкретный труд) и стоимость (абстрактный труд; величина — общественно необходимое рабочее время)."],["Как возникает прибавочная стоимость? Приведи пример с рабочим днём.","Капиталист покупает рабочую силу, рабочий создаёт больше стоимости, чем стоит его рабочая сила, разницу присваивает капиталист. Пример: день 10 часов — 4 часа необходимого времени (v) и 6 часов прибавочного (m); m′ = m/v = 150%."],["Структура стоимости товара по Марксу и способы роста прибавочной стоимости.","W = c + v + m; постоянный капитал c переносит стоимость, переменный v создаёт новую. Способы роста m: абсолютный (удлинение дня) и относительный (рост производительности)."],["Что Маркс говорит о накоплении капитала? Какие у марксизма основные труды и критика?","Накопление: концентрация капитала, резервная армия труда, снижение нормы прибыли, кризисы перепроизводства; классовая борьба. «Капитал» (1867, т.1); «Манифест» (1848). Критика: маржиналисты, проблема трансформации, обнищание не подтвердилось."],["Какие предпосылки неоклассики Маршалла?","Кембриджская школа, «Принципы экономической науки» (1890). Предпосылки: маржиналистская революция 1870-х (Джевонс, Менгер, Вальрас), «парадокс воды и алмаза»."],["Чем частичное равновесие Маршалла отличается от общего равновесия?","Маршалл применяет ceteris paribus и частичное равновесие; у Вальраса равновесие общее."],["Какие понятия и периоды вводит Маршалл?","Закон убывающей предельной полезности, эластичность спроса, потребительский излишек; четыре фактора: земля, труд, капитал, организация; периоды: рыночный, короткий, длительный, сверхдлительный; квазирента. Практика: ценовая дискриминация, акцизы на неэластичный спрос, налог Пигу."],["Каковы предпосылки и идеи немецкой исторической школы?","Предпосылки: раздробленность, отставание от Англии, таможенные барьеры. Идеи: нет универсальных законов — «национальная экономия»; индуктивный метод; государство — организующий центр; критика «экономического человека»."],["Назови этапы немецкой исторической школы.","Предшественник Ф. Лист; старая школа (Рошер, Гильдебранд, Книс); новая (Шмоллер, Брентано, Вагнер); новейшая (Вебер, Зомбарт)."],["Какие практические результаты немецкой исторической школы?","Германский таможенный союз (1834), «воспитательный протекционизм», социальное страхование Бисмарка (1880-е)."],["Кто основал австрийскую школу и кто её продолжил?","Менгер, «Основания политической экономии» (1871), Венский университет. Бём-Баверк, Визер, затем Мизес и Хайек."],["Назови идеи австрийской школы.","Методологический индивидуализм; субъективная теория ценности; предельная полезность; спонтанный порядок рынка; отказ от математизации; критика вмешательства государства и печатания денег; критика планирования."],["Где проявилась практика австрийской школы?","Реформы Эрхарда (1948 — отмена цен, твёрдая марка), тэтчеризм и рейганомика, Биткоин как идея денационализации денег Хайека."],["Чем старый институционализм отличается от нового?","Старый критикует капитализм, новый объясняет, откуда берутся институты."],["Кто представители старого и нового институционализма?","Старый: Веблен («Теория праздного класса», 1899; демонстративное потребление), Коммонс (сделка, право), Митчелл (циклы), позже Гэлбрейт (техноструктура, «Новое индустриальное общество», 1967). Новый: Коуз («Природа фирмы», 1937), Норт, Уильямсон, Бьюкенен."],["Из каких видов состоят институты по Норту?","Институты — «правила игры в обществе»: формальные, неформальные и механизмы принуждения."],["Основные идеи Кейнса («Общая теория занятости, процента и денег», 1936).","Рынок не всегда саморегулируется; совокупный (эффективный) спрос определяет выпуск и занятость; вынужденная безработица; государство регулирует спрос расходами и налогами. Предпосылка — Великая депрессия. AD = C + I + G + Nx."],["Как работает мультипликатор по Кейнсу?","Первоначальный расход вызывает цепь доходов; M = 1/(1 − MPC). Дополнительно: предпочтение ликвидности; инвестиции зависят от ожиданий. Критика кейнсианства: госдолг, инфляция."],["Чем неокейнсианство отличается от кейнсианства?","Акцент на рост, а не только на борьбу с кризисом (Харрод, Домар, Хансен, Хикс; 1950-е). Акселератор плюс мультипликатор; модель IS-LM (Хикс, Хансен), неоклассический синтез, кривая Филлипса. Государство воздействует систематически и прямо, добавляется монетарная политика."],["Что идеально в модели Харрода–Домара?","G = S / V (сбережения, делённые на капиталоёмкость); идеал — гарантированный темп роста равен естественному."],["Кто основатель монетаризма и какие у него предпосылки и выводы?","Фридман (Нобель 1976, Чикагская школа). Предпосылки — стагфляция 1970-х. Деньги — главный регулятор; инфляция — монетарный феномен; MV = PQ; NAIRU — естественный уровень безработицы."],["Какова практика монетаризма?","ФРС и Банк Англии контролируют агрегаты, независимость ЦБ, приватизация. Победа над инфляцией ценой безработицы."],["Что такое наивные, адаптивные и рациональные ожидания?","Наивные — завтра = сегодня; адаптивные — по ошибкам прошлого; рациональные (Мут, Лукас, Сарджент, Уоллес) — гипотеза рациональных ожиданий."],["В чём «критика Лукаса» (1976)?","Модели прошлого не работают, потому что политика меняет ожидания (Лукас — Нобель 1995)."],["Что меняет предсказуемая политика по теории рациональных ожиданий?","Она меняет номинальные показатели (цены, зарплаты), но не реальные (выпуск, занятость). Эффект даёт только неожиданная мера. Критика: ограниченная рациональность."],["Идеи и четыре столпа экономического консерватизма.","Идеи: частная собственность, критика Welfare State, источник роста — предложение, а не спрос (Лаффер, Фелдстайн). Четыре столпа: снижение налогов, дерегулирование, сокращение соцрасходов, приватизация."],["Какие результаты рейганомики и тэтчеризма?","Рейганомика (1981–89): налог на доходы со 70% до 28%, инфляция с 13,5% до 4,1%, но госдолг вырос втрое. Тэтчеризм: приватизация, борьба с профсоюзами, Right to Buy. Минусы консерватизма: неравенство, долг, деиндустриализация."],["Охарактеризуй индустриальное общество.","Главный ресурс — капитал, ведущий сектор — промышленность; термин Сен-Симона. Начиналось с промышленной революции в Англии (паровая машина Уатта, конвейер Форда). Занятость в сельском хозяйстве падает с 70–80% до 10–15%; урбанизация, буржуазия и пролетариат."],["Пять измерений постиндустриального общества по Беллу (1973).","Услуги вместо товаров; доминирует профессионально-технический класс; осевой принцип — теоретическое знание; ориентация на будущее (оценка технологий); «интеллектуальная технология» (моделирование, системный анализ). Промышленность не исчезает."],["Шесть признаков американской модели (США).","Частная собственность, конкуренция (закон Шермана 1890), фондовый рынок, гибкий рынок труда, ограниченное перераспределение, культура предпринимательства."],["Основные этапы развития модели США.","Конституция 1787, Шерман 1890, «Новый курс» 1935, Medicare 1965, рейганомика, Додд–Франк 2010. Около 26% мирового ВВП при 4% населения; минус — неравенство."],["Охарактеризуй китайскую модель.","Социалистическая рыночная экономика: руководящая роль КПК, смешанная собственность, особые экономические зоны, экспорт. Реформы Дэн Сяопина с 1978. Проблемы: диспропорции регионов, экология, перепроизводство. Новый курс — внутреннее потребление."],["Охарактеризуй французскую модель.","От дирижизма (1944–73, индикативное планирование, Ж. Монне) к «государству-стратегу». Поворот в 1983, приватизации Ширака и Балладюра, 35-часовая неделя (Жоспен), реформы Макрона. Государство — стратег и акционер; соцзащита сильная; проблемы — долг и дефицит."],["Охарактеризуй сингапурскую модель.","Авторитарный капитализм Ли Куан Ю. Экспортная индустриализация, транснациональные корпорации, «одно окно» (EDB), борьба с коррупцией (высокие оклады, презумпция виновности), порто-франко, образование на английском, жильё в собственность."],["Охарактеризуй швейцарскую модель.","Федерализм, прямая демократия, услуги около 74% экономики, малые и средние предприятия, профессиональное образование, «тормоз долга»."],["Что известно о шведской модели помимо Сальтшёбадена?","Социально ориентированная рыночная экономика, не социализм. Баланс государства, профсоюзов и работодателей, высокие налоги. Около 1950 — модель Рена–Мейднера."]]}];

  var SECTION_ORDER = ["Лекции", "Эволюция мысли", "Шпаргалки"];
  var KINDS = ["cards", "authors", "lists", "chrono", "pairs", "formulas", "questions"];
  var TRACKED = ["cards", "authors", "lists", "pairs", "formulas", "questions"]; // идут в счётчик «выучено»
  var KEY = "ekt-trainer-progress-v1";
  var FILE_TAG = "bsuir-ekt-trainer";

  /* ---------- данные: каждая запись получает ключ внутри темы ---------- */
  var byN = {}, byUid = {};
  function mkItem(T, kind, row){
    var it = { topic:T.n, kind:kind };
    if(kind === "cards"){ it.term = row[0]; it.def = row[1]; it.tag = row[2] || ""; it.key = "c:" + row[0]; }
    else if(kind === "authors"){ it.author = row[0]; it.work = row[1]; it.school = row[2] || ""; it.key = "a:" + row[0] + "|" + row[1]; }
    else if(kind === "lists"){ it.q = row.q; it.items = row.items; it.key = "l:" + row.q; }
    else if(kind === "chrono"){ it.ev = row[0]; it.period = row[1]; it.ord = row[2]; it.key = "h:" + row[0]; }
    else if(kind === "pairs"){ it.a = row[0]; it.b = row[1]; it.diff = row[2]; it.key = "p:" + row[0] + "|" + row[1]; }
    else if(kind === "formulas"){ it.name = row[0]; it.formula = row[1]; it.expl = row[2] || ""; it.key = "f:" + row[0]; }
    else if(kind === "questions"){ it.q = row[0]; it.a = row[1]; it.key = "q:" + row[0]; }
    return it;
  }
  TOPICS.forEach(function(T){
    byN[T.n] = T;
    T.items = {};
    KINDS.forEach(function(kind){
      var seen = {};
      T.items[kind] = (T[kind] || []).map(function(row){
        var it = mkItem(T, kind, row);
        if(seen[it.key]) it.key += "#" + (seen[it.key]++); else seen[it.key] = 1;
        it.uid = T.n + "|" + it.key;
        byUid[it.uid] = it;
        return it;
      });
    });
  });
  var SECTIONS = SECTION_ORDER.filter(function(s){
    return TOPICS.some(function(T){ return T.section === s; });
  });
  TOPICS.forEach(function(T){ if(SECTIONS.indexOf(T.section) === -1) SECTIONS.push(T.section); });

  /* ---------- состояние ---------- */
  var S = {
    sel: TOPICS.length ? "t:" + TOPICS[0].n : "",
    mode: "index", dir: "td", filter: "all",
    prog: {},               // { "<n темы>": { k:{ключ:1}, h:{ключ:1} } }
    order: {}, pos: 0, flipped: false,
    q: null, match: null, test: null, ch: null, query: ""
  };

  function topicProg(n, create){
    var p = S.prog[n];
    if(!p && create){ p = S.prog[n] = { k:{}, h:{} }; }
    return p;
  }
  function isKnown(it){ var p = topicProg(it.topic); return !!(p && p.k[it.key]); }
  function isHard(it){ var p = topicProg(it.topic); return !!(p && p.h[it.key]); }
  function markKnown(it){ var p = topicProg(it.topic, true); p.k[it.key] = 1; delete p.h[it.key]; }
  function markMiss(it){ var p = topicProg(it.topic, true); delete p.k[it.key]; p.h[it.key] = 1; }
  function toggleHard(it){ var p = topicProg(it.topic, true); if(p.h[it.key]) delete p.h[it.key]; else p.h[it.key] = 1; }

  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify({
        prog:S.prog, dir:S.dir, sel:S.sel, updated:Date.now()
      }));
    }catch(e){}
  }
  function validSel(sel){
    if(typeof sel !== "string") return false;
    if(sel.indexOf("t:") === 0) return !!byN[+sel.slice(2)];
    if(sel.indexOf("s:") === 0) return SECTIONS.indexOf(sel.slice(2)) !== -1;
    return false;
  }
  function cleanProg(src){
    var out = {};
    if(!src || typeof src !== "object") return out;
    for(var n in src){
      if(!src.hasOwnProperty(n) || !src[n] || typeof src[n] !== "object") continue;
      var k = src[n].k || {}, h = src[n].h || {};
      out[n] = { k:{}, h:{} };
      for(var a in k) if(k.hasOwnProperty(a) && k[a]) out[n].k[a] = 1;
      for(var b in h) if(h.hasOwnProperty(b) && h[b]) out[n].h[b] = 1;
    }
    return out;
  }
  function load(){
    try{
      var d = JSON.parse(localStorage.getItem(KEY) || "null");
      if(!d || typeof d !== "object") return;
      S.prog = cleanProg(d.prog);
      if(d.dir === "td" || d.dir === "dt") S.dir = d.dir;
      if(validSel(d.sel)) S.sel = d.sel;
    }catch(e){}
  }
  load();

  /* ---------- выборка ---------- */
  function selTopics(){
    if(S.sel.indexOf("s:") === 0){
      var s = S.sel.slice(2);
      return TOPICS.filter(function(T){ return T.section === s; });
    }
    var T = byN[+S.sel.slice(2)];
    return T ? [T] : [];
  }
  function itemsOf(topics, kind){
    var out = [];
    topics.forEach(function(T){ out = out.concat(T.items[kind]); });
    return out;
  }
  function selItems(kind){ return itemsOf(selTopics(), kind); }
  function allItems(kind){ return itemsOf(TOPICS, kind); }
  function passFilter(it){
    if(S.filter === "unlearned") return !isKnown(it);
    if(S.filter === "hard") return isHard(it);
    return true;
  }
  // колода: записи выбранных тем в текущем порядке, с учётом фильтра
  function deck(kind){
    var items = selItems(kind);
    var ord = S.order[kind];
    if(ord && ord.sel === S.sel){
      items = ord.uids.map(function(u){ return byUid[u]; }).filter(Boolean);
    }
    return items.filter(passFilter);
  }
  function stats(topics){
    var known = 0, total = 0;
    topics.forEach(function(T){
      TRACKED.forEach(function(kind){
        T.items[kind].forEach(function(it){ total++; if(isKnown(it)) known++; });
      });
    });
    return { known:known, total:total };
  }

  /* ---------- утилиты ---------- */
  function shuffled(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }
  function esc(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function each(sel, fn){ Array.prototype.forEach.call(view.querySelectorAll(sel), fn); }
  function $(id){ return document.getElementById(id); }
  function longCls(text, limit){ return String(text).length > (limit || 70) ? " long" : ""; }
  // нормализация ответа: регистр, ё/е, кавычки и знаки препинания, лишние пробелы
  function norm(s){
    return String(s).toLowerCase().replace(/ё/g, "е")
      .replace(/[«»"“”„'’`.,;:!?()\[\]]/g, " ").replace(/[‐‑–—]/g, "-")
      .replace(/\s+/g, " ").trim();
  }
  var WORD_SPLIT = /([^0-9a-zа-яё]+)/i;
  function tokens(s){ return norm(s).split(/[^0-9a-zа-я]+/).filter(function(t){ return t.length >= 3; }); }
  function stem(t){ return t.length <= 4 ? t : t.slice(0, Math.max(4, t.length - 3)); }
  function pluralRu(n, one, few, many){
    var m10 = n % 10, m100 = n % 100;
    if(m10 === 1 && m100 !== 11) return one;
    if(m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
  }
  // варианты: другие записи того же вида, сначала из выбранных тем, затем из всех
  function distractors(it, kind, n, valueOf){
    var mine = valueOf(it), seen = {}, out = [];
    seen[norm(mine)] = 1;
    [shuffled(selItems(kind)), shuffled(allItems(kind))].forEach(function(pool){
      pool.forEach(function(x){
        if(out.length >= n) return;
        var v = norm(valueOf(x));
        if(seen[v]) return;
        seen[v] = 1; out.push(x);
      });
    });
    return out;
  }

  var view = $("view");

  /* ---------- режимы ---------- */
  var MODES = [
    { id:"index",     label:"Темы" },
    { id:"cards",     label:"Карточки",        kind:"cards",     min:1 },
    { id:"learn",     label:"Заучивание",      kind:"cards",     min:2 },

    { id:"list",      label:"Список",          kind:"cards",     min:1 },
    { id:"authors",   label:"Кто что написал", kind:"authors",   min:2 },
    { id:"lists",     label:"Назови все",      kind:"lists",     min:1 },
    { id:"chrono",    label:"Хронология",      kind:"chrono",    min:2 },

    { id:"formulas",  label:"Формулы",         kind:"formulas",  min:1 },

  ];
  function modeById(id){ for(var i=0;i<MODES.length;i++) if(MODES[i].id === id) return MODES[i]; return null; }
  function modeAvailable(m){
    if(!m) return false;
    if(!m.kind) return true;
    // для «Кто что написал» и «Подбора» хватает вариантов и из других тем
    var have = selItems(m.kind).length;
    if(m.id === "authors") return have >= 1 && allItems("authors").length >= 2;
    return have >= m.min;
  }
  function availableModes(){ return MODES.filter(modeAvailable); }

  function renderNav(){
    var nav = $("modes");
    nav.innerHTML = availableModes().map(function(m){

  /* ---------- шапка ---------- */

      'Прогресс хранится в этом браузере. <a href="konspekt.html">Конспект</a> · <a href="formulas.html">Формулы</a>';

  function emptyState(msg){ return '<div class="panel"><div class="empty">' + msg + '</div></div>'; }

  function resetRuns(){ S.q = null; S.match = null; S.test = null; S.ch = null; S.pos = 0; S.flipped = false; }

  /* ---------------- темы ---------------- */
  var KIND_LABEL = { cards:"карточки", authors:"авторы", lists:"списки", chrono:"хронология", pairs:"отличия", formulas:"формулы", questions:"вопросы" };

  /* ---------------- карточки и формулы ---------------- */
  function flashFaces(it){
    if(it.kind === "formulas"){
      return {
        tag: "формула",
        front: '<div class="term' + longCls(it.name) + '">' + esc(it.name) + '</div>',
        back: '<div class="formula">' + esc(it.formula) + '</div>' + (it.expl ? '<div class="expl">' + esc(it.expl) + '</div>' : "")
      };
    }
    var t = '<div class="term' + longCls(it.term) + '">' + esc(it.term) + '</div>';
    var d = '<div class="term' + longCls(it.def, 60) + '">' + esc(it.def) + '</div>';
    return S.dir === "td" ? { tag: it.tag, front:t, back:d } : { tag: it.tag, front:d, back:t };
  }
  function renderFlash(kind){
    var d = deck(kind);
    if(!d.length){ view.innerHTML = emptyState(EMPTY_FILTER); return; }
    if(S.pos >= d.length) S.pos = 0;
    var it = d[S.pos], f = flashFaces(it), starred = isHard(it);
    var backLabel = kind === "formulas" ? "формула и обозначения" : (S.dir === "td" ? "определение" : "термин");

    view.innerHTML =
      '<div class="stage">' +
        '<div class="card-scene">' +
          '<button class="card' + (S.flipped ? " flipped" : "") + '" id="card" aria-label="Перевернуть карточку">' +
            '<div class="face front">' +
              (f.tag ? '<div class="tag">' + esc(f.tag) + '</div>' : "") + f.front +
              '<div class="face-hint">нажмите или пробел — перевернуть</div>' +
            '</div>' +
            '<div class="face back">' +
              '<div class="tag">' + backLabel + '</div>' + f.back +
              '<div class="face-hint">' + (isKnown(it) ? "в выученных" : "") + '</div>' +
            '</div>' +
          '</button>' +
          '<div class="card-tools">' +
            '<button class="icon-btn' + (starred ? " starred" : "") + '" id="starBtn" aria-pressed="' + starred + '" aria-label="Отметить как трудное" title="Трудное">' + (starred ? "★" : "☆") + '</button>' +
          '</div>' +
        '</div>' +
        '<div class="nav-row">' +
          '<button class="round-btn" id="prevBtn" aria-label="Предыдущая">‹</button>' +
          '<span class="counter">' + (S.pos+1) + " / " + d.length + '</span>' +
          '<button class="round-btn" id="nextBtn" aria-label="Следующая">›</button>' +
        '</div>' +
        '<div class="verdict-row">' +
          '<button class="verdict miss" id="missBtn">Ещё учить</button>' +
          '<button class="verdict ok" id="okBtn">Знаю</button>' +
        '</div>' +
      '</div>';

    $("card").onclick = function(){ S.flipped = !S.flipped; renderFlash(kind); };
    $("prevBtn").onclick = function(){ step(-1); };
    $("nextBtn").onclick = function(){ step(1); };
    $("starBtn").onclick = function(e){ e.stopPropagation(); toggleHard(it); save(); renderFlash(kind); };
    $("okBtn").onclick = function(){ markKnown(it); save(); renderHead(); advanceAfterVerdict(kind, it); };
    $("missBtn").onclick = function(){ markMiss(it); save(); renderHead(); advanceAfterVerdict(kind, it); };
  }
  // если отметка убрала карточку из колоды (фильтр), остаёмся на той же позиции
  function advanceAfterVerdict(kind, it){
    var d = deck(kind);
    var stillThere = d.some(function(x){ return x.uid === it.uid; });
    if(!d.length){ renderFlash(kind); return; }
    if(stillThere) S.pos = (S.pos + 1) % d.length;
    else if(S.pos >= d.length) S.pos = 0;
    S.flipped = false;
    renderFlash(kind);
  }
  function flashKind(){ return S.mode === "formulas" ? "formulas" : "cards"; }
  function step(n){
    var kind = flashKind(), d = deck(kind);
    if(d.length) S.pos = (S.pos + n + d.length) % d.length;
    S.flipped = false;
    renderFlash(kind);
  }

  /* ---------------- общие раунды ---------------- */
  function startQueue(kind){ S.q = { kind:kind, queue: shuffled(deck(kind)), i:0, right:0, wrong:0, answered:false }; }
  function ensureQueue(kind){ if(!S.q || S.q.kind !== kind) startQueue(kind); return S.q; }
  function scoreRow(q){
    return '<div class="score-row"><span>' + Math.min(q.i+1, q.queue.length) + " / " + q.queue.length + '</span><span>верно: ' + q.right + ' · ошибок: ' + q.wrong + '</span></div>';
  }
  function doneCard(q, extra){
    var total = q.right + q.wrong;
    var pct = total ? Math.round(q.right/total*100) : 0;
    return '<div class="panel done-card">' +
      '<div class="big-num">' + pct + '%</div>' +
      '<h2>Раунд пройден</h2>' +
      '<p>Верно ' + q.right + ' из ' + total + '. ' + (q.wrong ? 'Ошибки отмечены звёздочкой — повторите их с фильтром «Трудные ★».' : 'Ни одной ошибки.') + (extra || "") + '</p>' +
      '<button class="btn-primary" id="againBtn">Пройти ещё раз</button>' +
    '</div>';
  }
  function wireAgain(kind){ $("againBtn").onclick = function(){ startQueue(kind); render(); }; }
  function record(q, it, ok){
    if(ok){ q.right++; markKnown(it); } else { q.wrong++; markMiss(it); }
    save(); renderHead();
  }
  function nextBtnHtml(){ return '<div class="next-row"><button class="btn-primary" id="nextQ">Дальше</button></div>'; }
  function wireNext(q){
    var b = $("nextQ");
    b.onclick = function(){ q.answered = false; q.i++; render(); };
    b.focus();
  }

  /* ---------------- заучивание ---------------- */
  function renderLearn(){
    if(!deck("cards").length){ view.innerHTML = emptyState(EMPTY_FILTER); return; }
    var q = ensureQueue("cards");
    if(q.i >= q.queue.length){ view.innerHTML = doneCard(q); wireAgain("cards"); return; }
    var it = q.queue[q.i];
    if(!q.opts || q.optsFor !== it.uid){
      q.opts = shuffled(distractors(it, "cards", 3, function(x){ return x.term; }).concat([it]));
      q.optsFor = it.uid;
    }
    var td = S.dir === "td";
    var ask = td ? it.term : it.def;
    view.innerHTML =
      '<div class="panel">' +
        '<div class="prompt-label">' + (td ? "Выберите определение" : "Какой это термин?") + '</div>' +
        '<div class="prompt' + longCls(ask) + '">' + esc(ask) + '</div>' +
        '<div class="options">' +
          q.opts.map(function(o,k){ return '<button class="opt" data-k="' + k + '">' + esc(td ? o.def : o.term) + '</button>'; }).join("") +
        '</div>' +
        scoreRow(q) +
      '</div>';
    each(".opt", function(b){
      b.onclick = function(){
        var ok = q.opts[+b.dataset.k].uid === it.uid;
        each(".opt", function(x){
          x.disabled = true;
          if(q.opts[+x.dataset.k].uid === it.uid) x.classList.add("right");
        });
        if(!ok) b.classList.add("wrong");
        record(q, it, ok);
        setTimeout(function(){
          if(S.mode !== "learn" || S.q !== q) return;
          q.i++; renderLearn();
        }, ok ? 650 : 1400);
      };
    });
  }

  /* ---------------- письмо: термин по определению ---------------- */
  function answerForms(target){
    var out = [];
    function add(s){ var n = norm(s); if(n && out.indexOf(n) === -1) out.push(n); }
    add(target);
    add(target.replace(/\(.*?\)/g, " "));          // без пояснения в скобках
    (target.match(/\((.*?)\)/g) || []).forEach(function(p){ add(p.slice(1, -1)); }); // аббревиатура в скобках
    target.split(/\s*\/\s*/).forEach(add);           // варианты через «/»
    return out;
  }
  function accepts(it, input){
    var got = norm(input);
    return !!got && answerForms(it.term).indexOf(got) !== -1;
  }
  function renderWrite(){
    if(!deck("cards").length){ view.innerHTML = emptyState(EMPTY_FILTER); return; }
    var q = ensureQueue("cards");
    if(q.i >= q.queue.length){ view.innerHTML = doneCard(q); wireAgain("cards"); return; }
    var it = q.queue[q.i];
    view.innerHTML =
      '<div class="panel">' +
        '<div class="prompt-label">Напишите термин по определению</div>' +
        '<div class="prompt' + longCls(it.def) + '">' + esc(it.def) + '</div>' +
        '<form class="answer-form" id="wform" autocomplete="off">' +
          '<input class="answer" id="answerInput" placeholder="термин" aria-label="Ваш ответ" autocapitalize="none" spellcheck="false">' +
          '<button class="btn-primary" type="submit">Проверить</button>' +
        '</form>' +
        '<div id="fb"></div>' +
        scoreRow(q) +
      '</div>';
    var input = $("answerInput");
    input.focus();
    $("wform").onsubmit = function(e){
      e.preventDefault();
      if(q.answered){ q.answered = false; q.i++; renderWrite(); return; }
      if(!input.value.trim()) return;
      var ok = accepts(it, input.value);
      q.answered = true;
      record(q, it, ok);
      $("fb").innerHTML = '<div class="feedback ' + (ok ? "right" : "wrong") + '">' +
        (ok ? "Верно: " : "Правильный ответ: ") + '<b>' + esc(it.term) + '</b></div>';
      input.disabled = true;
      var btn = view.querySelector(".btn-primary");
      btn.textContent = "Дальше";
      btn.focus();
    };
  }

  /* ---------------- подбор ---------------- */
  function startMatch(){
    var pairs = shuffled(deck("cards")).slice(0, 6);
    var tiles = [];
    pairs.forEach(function(it){
      tiles.push({ uid:it.uid, side:"t", text:it.term });
      tiles.push({ uid:it.uid, side:"d", text:it.def });
    });
    S.match = { tiles:shuffled(tiles), pairs:pairs.length, left:pairs.length, picked:null, t0:Date.now(), done:false, misses:0 };
  }
  function renderMatch(){
    if(deck("cards").length < 2){ view.innerHTML = emptyState("Для подбора нужно хотя бы 2 карточки. Выберите «Все» в фильтре или другую тему."); return; }
    if(!S.match) startMatch();
    var m = S.match;
    if(m.done){
      var secs = Math.round((m.tEnd - m.t0)/1000);
      view.innerHTML = '<div class="panel done-card">' +
        '<div class="big-num">' + secs + ' с</div>' +
        '<h2>Все пары собраны</h2>' +
        '<p>' + m.pairs + ' ' + pluralRu(m.pairs, "пара", "пары", "пар") + ', ошибок: ' + m.misses + '.</p>' +
        '<button class="btn-primary" id="againBtn">Новый раунд</button></div>';
      $("againBtn").onclick = function(){ startMatch(); renderMatch(); };
      return;
    }
    view.innerHTML =
      '<div class="match-grid" id="grid">' +
        m.tiles.map(function(t,k){ return '<button class="tile ' + t.side + '" data-k="' + k + '">' + esc(t.text) + '</button>'; }).join("") +
      '</div>' +
      '<div class="score-row"><span>Соедините термин и определение</span><span>осталось пар: ' + m.left + '</span></div>';
    var grid = $("grid");
    Array.prototype.forEach.call(grid.children, function(el, k){
      var t = m.tiles[k];
      if(t.matched){ el.classList.add("gone"); el.disabled = true; return; }
      if(m.picked === k) el.classList.add("picked");
      el.onclick = function(){
        if(m.picked === null){ m.picked = k; renderMatch(); return; }
        if(m.picked === k){ m.picked = null; renderMatch(); return; }
        var a = m.tiles[m.picked];
        if(a.uid === t.uid && a.side !== t.side){
          a.matched = true; t.matched = true;
          m.picked = null; m.left--;
          if(m.left === 0){ m.done = true; m.tEnd = Date.now(); }
          renderMatch();
        } else {
          m.misses++;
          el.classList.add("bad");
          var prev = grid.children[m.picked];
          if(prev) prev.classList.add("bad");
          m.picked = null;
          setTimeout(function(){ if(S.mode === "match") renderMatch(); }, 340);
        }
      };
    });
  }

  /* ---------------- тест ---------------- */
  var TEST = { fmt:"choice", dir:"dt", count:10 };
  function startTest(){
    var pool = shuffled(deck("cards"));
    var n = TEST.count === "all" ? pool.length : Math.min(TEST.count, pool.length);
    var queue = pool.slice(0, n).map(function(it){
      var q = { item:it, given:"", ok:false };
      if(TEST.fmt === "choice") q.opts = shuffled(distractors(it, "cards", 3, function(x){ return x.term; }).concat([it]));
      return q;
    });
    S.test = { stage:"run", queue:queue, i:0, right:0 };
  }
  function testDir(){ return TEST.fmt === "write" ? "dt" : TEST.dir; }
  function tFront(it){ return testDir() === "td" ? it.term : it.def; }
  function tBack(it){ return testDir() === "td" ? it.def : it.term; }
  function renderTest(){
    if(!S.test){ renderTestSetup(); return; }
    if(S.test.stage === "done"){ renderTestResult(); return; }
    if(TEST.fmt === "write") renderTestWrite(); else renderTestChoice();
  }
  function renderTestSetup(){
    var avail = deck("cards").length;
    view.innerHTML =
      '<div class="panel">' +
        '<div class="setup-group">' +
          '<p class="setup-label">Формат теста</p>' +
          '<div class="format-grid">' +
            '<button class="format-card" data-fmt="choice" aria-pressed="' + (TEST.fmt === "choice") + '">' +

  /* ---------------- кто что написал ---------------- */
  function renderAuthors(){
    if(!deck("authors").length){ view.innerHTML = emptyState(EMPTY_FILTER); return; }
    var q = ensureQueue("authors");
    if(q.i >= q.queue.length){ view.innerHTML = doneCard(q); wireAgain("authors"); return; }
    var it = q.queue[q.i];
    if(!q.opts || q.optsFor !== it.uid){
      q.way = Math.random() < .5 ? "aw" : "wa";      // автор → труд или труд → автор
      var val = q.way === "aw" ? function(x){ return x.work; } : function(x){ return x.author; };
      q.opts = shuffled(distractors(it, "authors", 3, val).concat([it]));
      q.optsFor = it.uid; q.picked = null;
    }
    var aw = q.way === "aw";
    var ask = aw ? it.author : it.work;
    function optText(o){ return aw ? o.work : o.author; }
    view.innerHTML =
      '<div class="panel">' +
        '<div class="prompt-label">' + (aw ? "Что написал или предложил этот автор?" : "Кто автор?") + '</div>' +
        '<div class="prompt' + longCls(ask) + '">' + esc(ask) + '</div>' +
        '<div class="options">' +
          q.opts.map(function(o,k){
            var cls = "";
            if(q.answered){
              if(o.uid === it.uid || norm(optText(o)) === norm(optText(it))) cls = " right";
              else if(k === q.picked) cls = " wrong";
            }
            return '<button class="opt' + cls + '" data-k="' + k + '"' + (q.answered ? " disabled" : "") + '>' + esc(optText(o)) + '</button>';
          }).join("") +
        '</div>' +
        (q.answered ?
          '<div class="feedback ' + (q.lastOk ? "right" : "wrong") + '">' + (q.lastOk ? "Верно. " : "Неверно. ") +
            '<b>' + esc(it.author) + '</b> — ' + esc(it.work) +

          : "") +
