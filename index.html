<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренажёр ЭкТ</title>
<style>
  :root{
    --paper:#E9EDF2; --surface:#FFFFFF; --surface-2:#F4F7FA;
    --ink:#15202C; --muted:#5D6B7C; --line:#D3DBE4;
    --accent:#1D4E89; --accent-soft:#E0E9F5; --accent-ink:#ffffff;
    --gold:#B4801B; --ok:#2B7A5B; --ok-soft:#DCEFE6;
    --miss:#B0402C; --miss-soft:#F7E2DD;
    --shadow:0 1px 2px rgba(21,32,44,.06), 0 8px 24px rgba(21,32,44,.07);
    --radius:14px;
    --serif:Georgia, "Times New Roman", serif;
    --sans:system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0E131A; --surface:#18202B; --surface-2:#141C25;
      --ink:#E7EDF4; --muted:#93A2B3; --line:#2A3540;
      --accent:#7AA9EC; --accent-soft:#1E2B3C; --accent-ink:#0E131A;
      --gold:#DDB35C; --ok:#55B994; --ok-soft:#16302A;
      --miss:#E8836E; --miss-soft:#33201C;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0E131A; --surface:#18202B; --surface-2:#141C25;
    --ink:#E7EDF4; --muted:#93A2B3; --line:#2A3540;
    --accent:#7AA9EC; --accent-soft:#1E2B3C; --accent-ink:#0E131A;
    --gold:#DDB35C; --ok:#55B994; --ok-soft:#16302A;
    --miss:#E8836E; --miss-soft:#33201C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--paper); color:var(--ink);
    font-family:var(--sans); font-size:16px; line-height:1.5; margin:0;
    -webkit-font-smoothing:antialiased; overflow-wrap:anywhere;
  }
  .wrap{max-width:880px; margin:0 auto; padding-inline:16px; padding-block:0 48px}
  button{font:inherit; color:inherit; cursor:pointer}
  button:disabled{cursor:default; opacity:.55}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}

  /* ---------- header ---------- */
  header.top{
    position:sticky; top:env(safe-area-inset-top, 0px); z-index:20;
    background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .top-in{max-width:880px; margin:0 auto; padding-inline:16px; padding-block:14px 0}
  .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted);
  }
  .title-row{display:flex; align-items:flex-end; justify-content:space-between; gap:12px 16px; flex-wrap:wrap}
  .title-row > div:first-child{min-width:0}
  h1{
    font-family:var(--serif); font-weight:600;
    font-size:clamp(20px, 4.6vw, 28px); line-height:1.15; margin:2px 0 0;
    text-wrap:balance;
  }
  h1 .sub{display:block; font-size:14px; font-weight:400; font-family:var(--sans); color:var(--muted); margin-top:3px}
  .meter{display:flex; align-items:center; gap:10px; padding-bottom:3px}
  .meter-track{width:104px; height:6px; border-radius:99px; background:var(--line); overflow:hidden}
  .meter-fill{height:100%; width:0%; background:var(--ok); transition:width .35s ease}
  .meter-num{font-family:var(--mono); font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}

  nav.modes{display:flex; gap:2px; margin-top:12px; overflow-x:auto; scrollbar-width:none}
  nav.modes::-webkit-scrollbar{display:none}
  .mode{
    background:none; border:0; border-bottom:2px solid transparent;
    padding:9px 12px; font-size:14px; font-weight:500; color:var(--muted);
    white-space:nowrap; border-radius:6px 6px 0 0; text-decoration:none; display:inline-block;
  }
  .mode:hover{color:var(--ink)}
  .mode[aria-selected="true"]{color:var(--accent); border-bottom-color:var(--accent)}
  .mode.ext{color:var(--gold)}
  .mode-sep{flex:0 0 1px; background:var(--line); margin:8px 6px}

  /* ---------- controls ---------- */
  .toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:18px 0 16px}
  .chip{
    background:var(--surface); border:1px solid var(--line); border-radius:99px;
    padding:6px 13px; font-size:13px; color:var(--muted); display:inline-flex; align-items:center; gap:6px;
  }
  .chip:hover:not(:disabled){border-color:var(--accent); color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:500}
  .spacer{flex:1 1 auto}
  select.chip{appearance:none; -webkit-appearance:none; padding-right:26px; max-width:100%;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 15px) 12px, calc(100% - 10px) 12px;
    background-size:5px 5px,5px 5px; background-repeat:no-repeat;}
  select#topicSel{font-weight:500; color:var(--ink); min-width:0; flex:0 1 auto; text-overflow:ellipsis}

  /* ---------- окно прогресса ---------- */
  .gate{
    position:fixed; inset:0; z-index:50; overflow-y:auto;
    background:color-mix(in srgb, var(--paper) 94%, transparent);
    backdrop-filter:blur(8px);
    padding:16px; padding-top:calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom:calc(24px + env(safe-area-inset-bottom, 0px));
    display:flex; align-items:flex-start; justify-content:center;
  }
  .gate-card{
    width:100%; max-width:460px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); box-shadow:var(--shadow); padding:26px 22px;
  }
  .gate-eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--muted); margin-bottom:6px;
  }
  .gate-card h2{font-family:var(--serif); font-weight:600; font-size:23px; margin:0 0 6px; line-height:1.2}
  .gate-sub{color:var(--muted); font-size:13.5px; margin:0 0 20px; line-height:1.5}
  .divider{display:flex; align-items:center; gap:10px; margin:20px 0; color:var(--muted); font-size:12px}
  .divider::before, .divider::after{content:""; flex:1; height:1px; background:var(--line)}
  .link-btn{
    background:none; border:0; padding:0; color:var(--accent); font-size:13.5px;
    text-decoration:underline; text-underline-offset:3px;
  }
  .link-btn.danger{color:var(--miss)}
  .note{font-size:12.5px; color:var(--muted); line-height:1.55}
  .msg{padding:11px 13px; border-radius:11px; font-size:13.5px; margin-bottom:14px; border:1px solid}
  .msg.err{background:var(--miss-soft); border-color:var(--miss); color:var(--miss)}
  .msg.ok{background:var(--ok-soft); border-color:var(--ok); color:var(--ok)}
  .row-actions{display:flex; gap:9px; flex-wrap:wrap; margin-top:4px}
  .row-actions .btn-primary, .row-actions .btn-ghost{padding:11px 18px; font-size:14px}
  textarea.code{
    width:100%; min-height:110px; margin-top:10px; padding:12px; resize:vertical;
    font-family:var(--mono); font-size:11.5px; line-height:1.5;
    color:var(--ink); background:var(--surface-2); border:1px solid var(--line); border-radius:11px;
  }
  .stat-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:9px; margin:18px 0}
  @media (max-width:420px){ .stat-grid{grid-template-columns:repeat(2, 1fr)} }
  .stat{background:var(--surface-2); border:1px solid var(--line); border-radius:11px; padding:12px 13px}
  .stat b{display:block; font-family:var(--serif); font-size:22px; font-weight:600; font-variant-numeric:tabular-nums}
  .stat span{font-size:11.5px; color:var(--muted)}

  /* ---------- темы ---------- */
  .section-head{
    font-family:var(--mono); font-size:11px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--muted); margin:26px 0 9px;
  }
  .section-head:first-child{margin-top:0}
  .topic-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:10px}
  .topic-card{
    text-align:left; background:var(--surface); border:1px solid var(--line);
    border-radius:12px; box-shadow:var(--shadow); padding:15px 16px;
    display:flex; flex-direction:column; gap:7px; min-width:0;
  }
  .topic-card:hover{border-color:var(--accent)}
  .topic-card[aria-current="true"]{border-color:var(--accent); background:var(--accent-soft)}
  .topic-card.all{border-style:dashed; box-shadow:none; background:transparent}
  .topic-card.all[aria-current="true"]{background:var(--accent-soft)}
  .topic-no{font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:var(--gold); text-transform:uppercase}
  .topic-card b{font-family:var(--serif); font-weight:600; font-size:17px; line-height:1.25}
  .topic-bar{height:4px; border-radius:99px; background:var(--line); overflow:hidden; margin-top:3px}
  .topic-bar i{display:block; height:100%; background:var(--ok)}
  .topic-foot{font-family:var(--mono); font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
  .badges{display:flex; flex-wrap:wrap; gap:4px}
  .badge{font-size:11px; padding:1px 7px; border-radius:99px; background:var(--surface-2); border:1px solid var(--line); color:var(--muted)}
  .intro{color:var(--muted); font-size:14px; margin:0 0 18px}
  .intro a{color:var(--accent)}

  /* ---------- карточка ---------- */
  .stage{display:flex; flex-direction:column; align-items:center; gap:14px}
  .card-scene{width:100%; perspective:1400px; position:relative}
  .card{
    position:relative; width:100%; display:grid;
    transform-style:preserve-3d; transition:transform .5s cubic-bezier(.3,.8,.3,1);
    cursor:pointer; border:0; background:none; padding:0; text-align:left;
  }
  .card.flipped{transform:rotateY(180deg)}
  .face{
    grid-area:1/1; min-height:270px;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; padding:46px 22px 40px; text-align:center;
  }
  .face.back{transform:rotateY(180deg); background:var(--surface-2)}
  .term{
    font-family:var(--serif); font-weight:600;
    font-size:clamp(22px, 5.4vw, 34px); line-height:1.25; text-wrap:balance;
  }
  .term.long{font-size:clamp(17px, 3.6vw, 21px); font-weight:400; line-height:1.45}
  .face.back .term{font-weight:400}
  .formula{font-family:var(--mono); font-size:clamp(17px, 4.2vw, 24px); line-height:1.4}
  .expl{font-size:15px; color:var(--muted); max-width:560px}
  .tag{
    font-family:var(--mono); font-size:11px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--gold);
  }
  .face-hint{
    position:absolute; bottom:12px; left:0; right:0; text-align:center;
    font-size:12px; color:var(--muted);
  }
  .card-tools{position:absolute; top:10px; right:10px; display:flex; gap:4px; z-index:2}
  .icon-btn{
    width:34px; height:34px; display:grid; place-items:center;
    background:none; border:1px solid transparent; border-radius:9px; color:var(--muted); font-size:15px;
  }
  .icon-btn:hover{background:var(--surface-2); border-color:var(--line); color:var(--ink)}
  .icon-btn.starred{color:var(--gold)}

  .nav-row{display:flex; align-items:center; justify-content:center; gap:16px; width:100%}
  .round-btn{
    width:44px; height:44px; border-radius:50%; border:1px solid var(--line);
    background:var(--surface); display:grid; place-items:center; font-size:17px; color:var(--ink);
  }
  .round-btn:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}
  .counter{font-family:var(--mono); font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums; min-width:76px; text-align:center}
  .verdict-row{display:flex; gap:10px; width:100%; max-width:420px; margin-inline:auto}
  .verdict{
    flex:1; padding:11px 10px; border-radius:11px; border:1px solid var(--line);
    background:var(--surface); font-size:14px; font-weight:500;
  }
  .verdict.miss:hover{background:var(--miss-soft); border-color:var(--miss); color:var(--miss)}
  .verdict.ok:hover{background:var(--ok-soft); border-color:var(--ok); color:var(--ok)}

  /* ---------- вопросы ---------- */
  .panel{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:24px 20px;
  }
  .prompt-label{font-size:12px; color:var(--muted); text-align:center}
  .prompt{
    font-family:var(--serif); font-size:clamp(21px, 5vw, 28px);
    text-align:center; margin:6px 0 22px; text-wrap:balance; line-height:1.3;
    min-height:2.5em; display:flex; align-items:center; justify-content:center;
  }
  .prompt.long{font-size:clamp(16px, 3.8vw, 20px); line-height:1.5}
  .options{display:grid; gap:9px}
  .opt{
    text-align:left; padding:13px 15px; border-radius:11px; border:1px solid var(--line);
    background:var(--surface-2); font-size:15px; transition:background .15s, border-color .15s;
  }
  .opt:hover:not(:disabled){border-color:var(--accent); background:var(--accent-soft)}
  .opt:disabled{cursor:default; opacity:1}
  .opt.right{background:var(--ok-soft); border-color:var(--ok); color:var(--ok); font-weight:500}
  .opt.wrong{background:var(--miss-soft); border-color:var(--miss); color:var(--miss)}
  .answer-form{display:flex; gap:8px; flex-wrap:wrap}
  input.answer{
    flex:1 1 200px; min-width:0; padding:13px 15px; font:inherit; color:var(--ink);
    background:var(--surface-2); border:1px solid var(--line); border-radius:11px;
  }
  input.answer::placeholder{color:var(--muted)}
  .btn-primary{
    padding:13px 22px; border-radius:11px; border:1px solid var(--accent);
    background:var(--accent); color:var(--accent-ink); font-weight:500;
  }
  .btn-primary:hover:not(:disabled){filter:brightness(1.08)}
  .feedback{margin-top:16px; padding:13px 15px; border-radius:11px; font-size:15px; border:1px solid}
  .feedback.right{background:var(--ok-soft); border-color:var(--ok); color:var(--ok)}
  .feedback.wrong{background:var(--miss-soft); border-color:var(--miss); color:var(--miss)}
  .feedback.info{background:var(--surface-2); border-color:var(--line); color:var(--ink)}
  .feedback b{font-family:var(--serif); font-weight:600}
  .feedback .extra{display:block; margin-top:6px; color:var(--muted); font-size:14px}
  .next-row{display:flex; justify-content:center; margin-top:16px}
  .score-row{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
  .answer-box{margin:4px 0 18px; padding:14px 16px; border-radius:11px; background:var(--surface-2); border:1px solid var(--line); font-size:16px; line-height:1.55}

  /* ---------- подбор ---------- */
  .match-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:9px}
  @media (max-width:560px){ .match-grid{grid-template-columns:repeat(2, 1fr)} }
  .tile{
    min-height:82px; padding:10px 8px; border-radius:11px; border:1px solid var(--line);
    background:var(--surface); box-shadow:var(--shadow); font-size:13px; line-height:1.35;
    display:grid; place-items:center; text-align:center; min-width:0;
  }
  .tile.t{font-family:var(--serif); font-size:15px; font-weight:600}
  .tile:hover:not(:disabled){border-color:var(--accent)}
  .tile.picked{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
  .tile.gone{opacity:0; pointer-events:none; transition:opacity .3s}
  .tile.bad{animation:shake .32s}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  /* ---------- назови все ---------- */
  .slots{display:grid; gap:7px; margin:0 0 16px; padding:0; list-style:none; counter-reset:slot}
  .slot{
    counter-increment:slot; display:flex; gap:10px; align-items:baseline;
    padding:9px 12px; border-radius:10px; border:1px dashed var(--line); background:var(--surface-2);
    color:var(--muted); font-size:15px; text-align:left; width:100%;
  }
  .slot::before{content:counter(slot) "."; font-family:var(--mono); font-size:12px; color:var(--muted); min-width:1.6em}
  .slot.found{border-style:solid; border-color:var(--ok); background:var(--ok-soft); color:var(--ok)}
  .slot.missed{border-style:solid; border-color:var(--miss); background:var(--miss-soft); color:var(--miss)}
  .slot.self{border-style:solid; border-color:var(--gold); color:var(--ink)}
  button.slot:hover{border-color:var(--gold)}
  .hint-line{min-height:1.4em; font-size:13px; color:var(--muted); margin-top:8px}

  /* ---------- хронология ---------- */
  .chrono{list-style:none; margin:0 0 16px; padding:0; display:grid; gap:8px}
  .chrono li{
    display:flex; align-items:center; gap:10px; padding:10px 10px 10px 12px;
    border-radius:11px; border:1px solid var(--line); background:var(--surface-2);
    touch-action:manipulation; user-select:none; -webkit-user-select:none;
  }
  .chrono li[draggable="true"]{cursor:grab}
  .chrono li.dragging{opacity:.4}
  .chrono li.over{border-color:var(--accent); background:var(--accent-soft)}
  .chrono li.right{border-color:var(--ok); background:var(--ok-soft)}
  .chrono li.wrong{border-color:var(--miss); background:var(--miss-soft)}
  .chrono .grip{color:var(--muted); font-size:14px; letter-spacing:-2px}
  .chrono .pos-n{font-family:var(--mono); font-size:12px; color:var(--muted); min-width:1.4em}
  .chrono .ev{flex:1; min-width:0; font-size:15px}
  .chrono .period{display:block; font-size:12.5px; color:var(--muted); font-family:var(--mono)}
  .chrono .mv{display:flex; gap:4px}
  .chrono .mv button{width:36px; height:36px; border-radius:9px; border:1px solid var(--line); background:var(--surface); font-size:15px}
  .chrono .mv button:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}

  /* ---------- тест ---------- */
  .setup-label{
    font-family:var(--mono); font-size:11px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--muted); margin:0 0 9px;
  }
  .setup-group + .setup-group{margin-top:22px}
  .format-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  @media (max-width:520px){ .format-grid{grid-template-columns:1fr} }
  .format-card{
    text-align:left; padding:16px; border-radius:12px; border:1px solid var(--line);
    background:var(--surface-2); display:flex; flex-direction:column; gap:5px;
  }
  .format-card:hover{border-color:var(--accent)}
  .format-card[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent)}
  .format-card b{font-family:var(--serif); font-weight:600; font-size:17px}
  .format-card span{font-size:13px; color:var(--muted); line-height:1.4}
  .format-card[aria-pressed="true"] span{color:var(--ink)}
  .seg{display:flex; flex-wrap:wrap; gap:7px}
  .seg .chip{background:var(--surface-2)}
  .test-start{width:100%; margin-top:24px}
  .qbar{height:4px; border-radius:99px; background:var(--line); overflow:hidden; margin-bottom:20px}
  .qbar-fill{height:100%; background:var(--accent); transition:width .3s ease}
  .test-meta{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); margin-bottom:10px; font-variant-numeric:tabular-nums}
  .skip-btn{
    display:block; margin:14px auto 0; background:none; border:0;
    font-size:13px; color:var(--muted); text-decoration:underline; text-underline-offset:3px;
  }
  .skip-btn:hover{color:var(--ink)}
  .review-head{font-family:var(--serif); font-weight:600; font-size:18px; margin:26px 0 10px}
  .your-answer{color:var(--miss); font-size:14px}
  .your-answer.blank{color:var(--muted); font-style:italic}
  .done-actions{display:flex; gap:9px; justify-content:center; flex-wrap:wrap}
  .btn-ghost{padding:13px 22px; border-radius:11px; border:1px solid var(--line); background:var(--surface); font-weight:500}
  .btn-ghost:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}

  /* ---------- список ---------- */
  table{width:100%; border-collapse:collapse; font-size:15px}
  .table-wrap{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden}
  th{
    text-align:left; font-family:var(--mono); font-weight:500;
    font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
    padding:11px 12px; border-bottom:1px solid var(--line); background:var(--surface-2);
  }

ли более производительных аналогов"],["Комплементы","Субституты","Комплементы потребляются вместе (чай и печенье); субституты взаимозаменяемы (кофе и чай)"],["Свободные блага","Экономические блага","Свободные не ограничены (воздух); экономические ограничены и имеют цену"],["Потенциальные потребности","Платёжеспособные потребности","Платёжеспособные — реальный спрос"]],"formulas":[["Норма амортизации","Норма амортизации = 1 / срок службы × 100%","Пример: станок 50 000 руб., срок службы 10 лет: 1/10 × 100% = 10% в год; амортизация = 5 000 руб. в год (линейный способ)."]],"questions":[["Что такое потребность?","Нужда в благах, необходимых для жизни и развития; мотив и цель производства."],["В чём разница между ресурсами и факторами производства?","Ресурс — запас, фактор — ресурс, уже работающий в производстве."],["Какой доход приносит каждый фактор производства?","Земля — рента, труд — заработная плата, капитал — процент, предпринимательские способности — прибыль."],["Как рассчитать амортизацию при сроке службы 10 лет и стоимости 50 000 руб.?","Норма = 1/10 × 100% = 10% в год, амортизация = 5 000 руб. в год."],["Главная идея темы II","Потребности безграничны, а ресурсы ограничены, поэтому приходится выбирать, чем жертвовать (альтернативная стоимость)."]]},{"n":6,"title":"II.2 Предпринимательство, прибыль и издержки","section":"Лекции","cards":[["Предпринимательская способность","Совокупность физических и интеллектуальных способностей человека к организации бизнеса; реализуется через предпринимательскую деятельность.","Предпринимательство"],["НИОКР","Научно-исследовательские и опытно-конструкторские разработки (высокие технологии); повышают производительность труда.","Предпринимательство"],["Производительность труда","Количество продукции в единицу времени (или произведённое одним работником); AP_L = TP_L (Q) / L.","Предпринимательство"],["TP_L (Q)","Общий продукт (total product) — количество продукции.","Формулы"],["L","Труд (labor) — количество работников.","Формулы"],["TC","Общие издержки.","Формулы"],["ATC","Средние общие издержки (издержки на единицу продукции): ATC = TC / Q.","Формулы"],["TR","Общий доход от реализации всей массы продуктов: TR = P × Q.","Формулы"],["AR","Средний доход: AR = TR / Q = P.","Формулы"],["АП","Средняя прибыль: АП = AR − ATC.","Формулы"],["ТП","Общая прибыль: ТП = TR − TC.","Формулы"],["Экономическая прибыль","Прибыль при TR > TC, ТП > 0.","Прибыль"],["Нормальная прибыль","Ситуация TR = TC, ТП = 0: выручка лишь покрывает издержки (рента, процент, зарплата). Не убыток.","Прибыль"],["Убыток","Ситуация TR < TC, ТП < 0.","Прибыль"]],"lists":[{"q":"Назовите характеристики предпринимательской деятельности","items":["Организация процесса производства, соединяя материальные и трудовые ресурсы","Решение, что, как и для кого производить, и полная материальная ответственность","Инновационность: внедрение высоких технологий (результатов НИОКР)","Рисковость"]},{"q":"Назовите три ситуации риска (TR и TC)","items":["TR > TC, ТП > 0 — экономическая прибыль","TR = TC, ТП = 0 — нормальная прибыль","TR < TC, ТП < 0 — убыток"]},{"q":"Назовите цепочку «от НИОКР к прибыли»","items":["НИОКР","AP_L ↑","TP ↑ и ATC ↓","max ТП"]}],"pairs":[["Нормальная прибыль","Убыток","Нормальная прибыль: ТП = 0, все издержки (зарплата, процент, рента) покрыты; убыток: ТП < 0, TR < TC"],["Экономическая прибыль","Нормальная прибыль","Экономическая: TR > TC, ТП > 0; нормальная: TR = TC, ТП = 0"],["Средняя прибыль (АП)","Общая прибыль (ТП)","АП = AR − ATC (с единицы); ТП = TR − TC (общая)"]],"formulas":[["Производительность труда","AP_L = TP_L (Q) / L","AP_L — средний продукт труда (производительность труда); TP_L (Q) — общий продукт (количество продукции); L — труд (количество работников)."],["Средние общие издержки","ATC = TC / Q","TC — общие издержки; ATC — средние общие издержки (издержки на единицу); Q — количество."],["Общий и средний доход","TR = P × Q ⇒ AR = TR / Q = P","TR — общий доход от реализации всей массы продуктов; AR — средний доход; P — цена; Q — количество."],["Средняя прибыль","АП = AR − ATC","АП — средняя прибыль; AR = P — цена; ATC — средние общие издержки."],["Общая прибыль","ТП = TR − TC","ТП — общая прибыль; TR — общий доход; TC — общие издержки."],["Общая прибыль через среднюю","ТП = АП × Q","ТП — общая прибыль; АП — средняя прибыль; Q — количество."]],"questions":[["Как фирма при заданной рынком цене может нарастить прибыль?","Цена задана рынком (AR = P = const), поэтому только так: ATC↓ → АП↑, и вместе с ростом объёма выпуска Q↑ → ТП↑."],["Что такое нормальная прибыль?","ТП = 0, TR = TC: все издержки (в том числе зарплата, процент, рента) покрыты; это не убыток."],["Что делать при нормальной прибыли или убытке?","Выход из ситуаций 2 и 3 — внедрение высоких технологий."],["Пример пекарни: 1 000 булок, P = 2 руб., TC = 1 500 руб. Чему равны TR, ТП, ATC, АП?","TR = 2 000, ТП = 500, ATC = 1,5, АП = 2 − 1,5 = 0,5 руб. с булки. Новая печь снижает ATC до 1,2 → АП = 0,8, ТП = 800 руб."]]},{"n":7,"title":"II.3 Что, как и для кого производить","section":"Лекции","cards":[["Проблема выбора в экономике","Возникает из двух фундаментальных фактов: потребности (материальные) безграничны, а ресурсы ограничены. Общество в каждый момент вынуждено выбирать, какие блага производить, а от каких отказываться, чтобы максимально удовлетворить материальные потребности людей.","Выбор"],["ЧТО производить","Какой набор и какое количество экономических благ необходимо и возможно создать в данный момент времени.","Выбор"],["КАК производить","Какие технологии использовать.","Выбор"],["Технология производства","Сочетание (соединение) трудовых и материальных ресурсов в определённых количественных и качественных сочетаниях.","Выбор"],["ДЛЯ КОГО производить","Блага для удовлетворения потребностей людей (различные социальные слои и группы); уровень потребления зависит от уровня дохода, а он — от количества и качества ресурсов, которые человек предлагает экономике.","Выбор"]],"lists":[{"q":"Назовите три вопроса экономики (проблема выбора)","items":["ЧТО производить","КАК производить","ДЛЯ КОГО производить"]},{"q":"Назовите два фундаментальных факта, лежащих в основе экономики","items":["Потребности (материальные) безграничны","Ресурсы ограничены"]},{"q":"Назовите виды несовершенной конкуренции (неэффективное решение вопроса КАК)","items":["Монополистическая конкуренция","Олигополия","Монополия (частное производство)"]}],"pairs":[["Эффективное решение ЧТО производить","Неэффективное решение ЧТО производить","Эффективное: эффективное распределение редких ресурсов, максимальное удовлетворение общественных потребностей (рыночная, смешанная экономика); неэффективное: регулятор = план (командно-административная система, традиционное общество)"],["Совершенная конкуренция","Несовершенная конкуренция","Совершенная — экономическая эффективность в производстве; несовершенная (монополистическая конкуренция, олигополия, монополия) — неэффективное производство"],["Рыночная экономика (ДЛЯ КОГО)","Командно-административная система (ДЛЯ КОГО)","Рынок жёстко фиксирует количество и качество предлагаемых ресурсов, дети, пенсионеры, инвалиды исключаются из числа получателей доходов → проблема социальной справедливости; командная система → уравнительное распределение, социально-экономическая развращённость, деградация, регресс"]],"questions":[["В чём суть проблемы выбора?","Общество в каждый момент времени вынуждено выбирать, какие блага производить, а от каких отказываться, чтобы максимально удовлетворить материальные потребности людей."],["Где эффективно решается вопрос ЧТО производить?","В рыночной и смешанной экономике."],["Где неэффективно решается вопрос ЧТО производить?","В командно-административной системе и традиционном обществе (регулятор = план)."],["Как решается проблема ДЛЯ КОГО в смешанной экономике?","Государство решает проблему социальной справедливости через перераспределение доходов: налоги → пенсии, пособия, бесплатные образование и медицина."]]},{"n":8,"title":"II.4 Производственные возможности и кривая ПВО","section":"Лекции","cards":[["Альтернативные издержки","Альтернативные (экономические, вменённые) издержки производства блага А — количество блага Б, от которого необходимо отказаться, чтобы произвести некоторое количество исходного блага А.","ПВО"],["Экономическая эффективность производства","max результат / min затраты = max AP_L / min ATC.","ПВО"],["Идеальная экономика","Экономика полной занятости ресурсов (нет безработицы и незанятых производственных мощностей) и полного объёма производства.","ПВО"],["Статичная экономика","Количество и качество ресурсов = const.","ПВО"],["ПСП","Производство средств производства (блага А; в примере «роботы»).","ПВО"],["ППП","Производство предметов потребления (блага Б; в примере «пицца»).","ПВО"],["Кривая ПВО (кривая трансформации)","Показывает, что для производства большего количества одного блага общество отказывается от всё большего количества другого.","ПВО"],["Закон возрастающих издержек","Когда общество увеличивает производство блага А, оно вынуждено отказываться от производства всё большего количества блага Б.","ПВО"],["Экономический рост","Изменение выпуска общего объёма благ; меняется количество и/или качество ресурсов.","Рост"],["Экстенсивный рост","Рост за счёт увеличения количества ресурсов.","Рост"],["Интенсивный рост","Рост за счёт увеличения качества ресурсов.","Рост"],["Смешанный рост","Изменение и количества, и качества ресурсов.","Рост"],["Неполная занятость ресурсов","Безработица (L, трудовые ресурсы) и незанятые производственные мощности (K, капитал — материальные ресурсы).","ПВО"],["Y","Объём производства благ (ВВП [ВНД]).","ПВО"]],"lists":[{"q":"Назовите допущения модели ПВО","items":["Идеальная экономика — полная занятость ресурсов и полный объём производства","Статичная экономика — количество и качество ресурсов = const","Упрощение — всего 2 товара: блага А (средства производства, ПСП) и блага Б (предметы потребления, ППП)"]},{"q":"Что иллюстрирует кривая ПВО","items":["Альтернативные возможности общества в производстве двух товаров","Максимальный объём производства двух благ","Закон возрастающих альтернативных (вменённых, экономических) издержек"]},{"q":"Назовите типы экономического роста","items":["Экстенсивный (↑ количества ресурсов)","Интенсивный (↑ качества ресурсов)","Смешанный (изменение и количества, и качества)"]},{"q":"Назовите причины и проявления неидеальной экономики","items":["Неполная занятость ресурсов: безработица (L)","Незанятые производственные мощности (K)","Неэффективность в производстве и потреблении"]},{"q":"Что происходит с кривой ПВО при изменении выпуска ΔY","items":["Эк. рост + — сдвиг наружу","Эк. рост = 0 — на месте (A = const, Б = const)","Эк. рост − — сдвиг внутрь"]},{"q":"Назовите последствия снижения выпуска Y (ВВП) в неидеальной экономике","items":["Отрицательный экономический рост","Экономический спад и дно","Кризис"]}],"pairs":[["Движение по кривой ПВО","Экономический рост","Движение по кривой — это выбор, а не рост; рост — сдвиг кривой наружу"],["Экстенсивный рост","Интенсивный рост","Экстенсивный — за счёт количества ресурсов; интенсивный — за счёт качества ресурсов"],["Точка A","Точка E","A = отказ от потребления в настоящем; E = отказ от потребления в будущем (нет средств производства)"],["Спад (кривая внутрь)","Рост (кривая наружу)","Кризис сдвигает КПВ внутрь целиком (меньше и А, и Б), рост — наружу (больше и А, и Б)"],["ПСП","ППП","ПСП — производство средств производства (блага А); ППП — производство предметов потребления (блага Б)"]],"formulas":[["Альтернативные издержки","Альт. издержки А = потеряно Б / получено А = ΔБ (потеряно) / ΔА (получено)","Сколько единиц блага Б приходится отдать, чтобы получить одну единицу блага А. Участок C→D: потеряно 3 тыс. роботов, получена 1 сотня тыс. пицц — «цена» пиццы 3 робота."],["Экономическая эффективность производства","max результат / min затраты = max AP_L / min ATC","AP_L — средний продукт труда; ATC — средние общие издержки."]],"questions":[["Почему кривая ПВО выгнута наружу?","Из-за закона возрастающих издержек: первые 100 тыс. пицц (A→B) стоят 1 тыс. роботов, последние (D→E) — уже 4 тыс."],["Какова причина закона возрастающих издержек?","Качественная неоднородность ресурсов, занятых в производстве альтернативных благ: они несовершенные заменители, полной взаимозаменяемости нет, поэтому для роста производства А приходится изымать из Б всё больше ресурсов и адаптировать их."],["Почему альтернатива A неприемлема?","Общество хочет потреблять предметы потребления и в настоящем, и в будущем; A = отказ от потребления в настоящем."],["Почему альтернатива E нереальна?","E = отказ от потребления в будущем (нет средств производства)."],["Что значит движение A → E и E → A?","A → E: увеличиваем потребление в настоящем, сокращаем в будущем; E → A — наоборот."],["Что означают точки внутри, на и вне кривой?","Внутри — ресурсы используются неполностью (неэффективно), на кривой — эффективно, снаружи — недостижимо при текущих ресурсах."],["Что делает кризис с кривой ПВО?","Сдвигает её внутрь целиком (меньше и А, и Б)."],["Сколько роботов стоит единица пиццы на участке C→D?","3 тыс. роботов за 1 сотню тыс. пицц: ΔРоботы / ΔПицца = 3 / 1."]]},{"n":9,"title":"III.1 Экономическая система общества","section":"Лекции","cards":[["Система","Совокупность взаимосвязанных элементов.","Экономическая система"],["Экономическая система (ЭС)","Экономика, представленная как система (модель) трёх субъектов — домашних хозяйств, фирм и государства, — между которыми по кругу движутся ресурсы, товары и доходы.","Экономическая система"],["Управляющие элементы ЭС","Субъекты производства и потребления: домашние хозяйства (семьи), фирмы, государство. Критерий выделения — ролевая функция субъекта в экономике.","Экономическая система"],["Домашние хозяйства","Субъект, выполняющий потребление экономических благ (личное потребление); собственники ресурсов и получатели доходов; расходующая группа.","Субъекты"],["Фирмы","Субъект с производственной функцией: создание благ и их реализация с целью максимальной прибыли; приобретают материальные и трудовые ресурсы у домашних хозяйств, выплачивая им доходы.","Субъекты"],["Государство","Субъект с правовой функцией (защита собственников от экспроприации) и экономической (предпринимательство, создание инфраструктуры экономики).","Субъекты"],["Экспроприация","Безвозмездное изъятие.","Субъекты"],["Инфраструктура экономики","Финансовая, кредитно-денежная, транспортная, коммуникационная системы, создаваемые государством для функционирования субъектов.","Субъекты"],["L, K","Ресурсы (труд и капитал).","Кругооборот"],["C","Издержки производства.","Кругооборот"],["x, y","Товары и услуги.","Кругооборот"],["R","Доход от реализации (у фирм и у государства как предпринимателя).","Кругооборот"],["I","Потребительские доходы: зарплата Gw, нормальная прибыль Пn, процент i, рента r.","Кругооборот"],["Ex","Потребительские расходы.","Кругооборот"],["G","Государственные расходы.","Кругооборот"],["TF","Налог на прибыль фирм.","Кругооборот"],["TI","Подоходный налог домашних хозяйств.","Кругооборот"],["xG, yG","Товары и услуги, которые покупает государство.","Кругооборот"],["Вещественный поток","Ресурсы L, K идут к фирмам; товары x, y идут к домашним хозяйствам.","Кругооборот"],["Денежный поток","Доходы I идут к домашним хозяйствам; расходы Ex идут к фирмам как выручка R.","Кругооборот"]],"lists":[{"q":"Назовите план темы «Экономическая система общества»","items":["Экономическая система: содержание, элементы, уровни","Собственность как экономическая категория и юридическая форма","Способы координации экономической деятельности: рынок, смешанная экономика, командно-административная экономика; кругооборот продуктов, ресурсов и доходов","Типология современных экономических систем"]},{"q":"Назовите субъектов экономической системы (управляющие элементы)","items":["Домашние хозяйства (семьи)","Фирмы","Государство"]},{"q":"Назовите способы координации экономической деятельности","items":["Рынок","Смешанная экономика","Командно-административная экономика"]},{"q":"Назовите доходы домашних хозяйств как собственников ресурсов","items":["Труд — заработная плата","Предпринимательство — прибыль","Капитал — процент","Земля — рента"]},{"q":"Назовите экономические функции государства","items":["Само осуществляет предпринимательство","Создаёт инфраструктуру экономики (финансовая, кредитно-денежная, транспортная, коммуникационная системы)"]},{"q":"Назовите потребительские доходы I в кругообороте","items":["Зарплата Gw","Нормальная прибыль Пn","Процент i","Рента r"]},{"q":"Назовите два встречных потока кругооборота","items":["Вещественный (ресурсы L, K → фирмам; товары x, y → домашним хозяйствам)","Денежный (доходы I → домашним хозяйствам; расходы Ex → фирмам как выручка R)"]},{"q":"Назовите налоги в схеме кругооборота","items":["TF — налог на прибыль фирм","TI — подоходный налог домашних хозяйств"]}],"formulas":[["Равенство издержек и доходов в кругообороте","C = I","C — издержки производства фирм; I — потребительские доходы домашних хозяйств (зарплата Gw, нормальная прибыль Пn, процент i, рента r)."]],"questions":[["Из каких субъектов состоит экономическая система?","Из домашних хозяйств, фирм и государства; между ними по кругу движутся ресурсы, товары и доходы."],["Какой критерий выделения субъектов экономики?","Ролевая функция субъекта в экономике."],["Какие методы использует ЭкТ при рассмотрении экономической системы?","Метод системного анализа и метод упрощения, благодаря которым сложное явление представляется как экономическая система или модель."],["Что чему равно в кругообороте?","C = I: издержки фирм равны доходам домашних хозяйств."],["Какова правовая функция государства?","Защита субъектов собственности от экспроприации (безвозмездного изъятия)."],["Что делает государство в кругообороте?","В центре берёт налоги (TF, TI) и возвращает их как расходы G и услуги; как предприниматель ещё продаёт товары x, y и получает выручку R."]]},{"n":20,"title":"0. Хронологическая шп ":21,"title":"I. Ранние экономические школы","section":"Эволюция мысли","cards":[["Меркантилизм","От итал. mercante — купец. Не единая научная школа, а набор практических рекомендаций; авторы — купцы и чиновники, форма — памфлеты. XVI–XVIII вв.","Меркантилизм"],["Бульонизм (монетарная система)","Ранний меркантилизм (XVI в.), от bullion — слиток. Запрет вывоза денег и золота, ограничение импорта, высокие пошлины. Идея активного ДЕНЕЖНОГО баланса.","Меркантилизм"],["Мануфактурная система","Поздний меркантилизм (XVII в.). Идея активного ТОРГОВОГО баланса; вывозить готовые товары, а не сырьё; вывоз денег допускается ради выгодных сделок.","Меркантилизм"],["Формула Мана","Экспорт > Импорт ⇒ денежный фонд страны.","Меркантилизм"],["Навигационный акт Кромвеля","1651, действовал до 1840; направлен против Голландии.","Меркантилизм"],["Кольбертизм","Политика Ж.-Б. Кольбера (1619–1683): высокие пошлины, контроль качества, зарплата на минимуме.","Меркантилизм"],["Итог меркантилизма","Первая попытка осмыслить экономику на уровне государства; основа протекционизма. Ошибка — богатство = золото, игнор производства.","Меркантилизм"],["Черты меркантилизма","Макроподход; предмет — торговля, а не производство; производительным считался труд лишь по добыче золота и серебра; активное вмешательство государства; протекционизм.","Меркантилизм"],["Предпосылки меркантилизма","Крах феодализма и переход к товарно-денежным отношениям; Великие географические открытия («революция цен»); мировой рынок; абсолютизм и нужда в деньгах на армию и флот; мануфактуры.","Меркантилизм"],["Физиократия","От physis (природа) + kratos (власть) = «господство природы». 1750–1789, Франция. Первая систематическая школа; переход от меркантилизма к классике.","Физиократия"],["Чистый продукт","Излишек над затратами; по физиократам его даёт только земля/сельское хозяйство.","Физиократия"],["Стерильный класс","Непроизводительный класс (ремесленники, торговцы, чиновники): промышленность и торговля «стерильны» — лишь перераспределяют.","Физиократия"],["Природный порядок","Объективные вечные законы (идея 2 физиократов).","Физиократия"],["Laissez faire у физиократов","Минимальное вмешательство, свобода торговли, частная собственность. Единый налог на землю.","Физиократия"],["Три класса физиократов","Производительный (крестьяне, фермеры), собственники земли (аристократия, получают ренту), непроизводительный (ремесленники, торговцы, чиновники).","Физиократия"],["Упадок физиократии","Французская революция 1789, рост промышленности, односторонность взглядов.","Физиократия"],["Термин «политическая экономия»","Ввёл А. де Монкретьен («Трактат о политической экономии», 1615).","Меркантилизм"]],"authors":[["У. Стаффорд","Ранний меркантилизм (XVI в.): монетарная система, бульонизм","Меркантилизм"],["Т. Ман (1571–1641)","«Рассуждение о торговле Англии с Ост-Индией» (1621)","Меркантилизм"],["Т. Ман (1571–1641)","«Богатство Англии во внешней торговле» (1630)","Меркантилизм"],["А. де Монкретьен","«Трактат о политической экономии» (1615); ввёл термин «политическая экономия»","Меркантилизм"],["Ж.-Б. Кольбер (1619–1683)","Кольбертизм: высокие пошлины, контроль качества, зарплата на минимуме","Меркантилизм"],["Ф. Кенэ (1694–1774)","«Экономическая таблица» (1758) — первая макромодель кругооборота","Физиократия"],["А. Тюрго (1727–1781)","Свобода торговли; прибыль аналогична проценту; реформы (налоги, отмена цехов)","Физиократия"]],"lists":[{"q":"Назовите представителей позднего меркантилизма (XVII в.)","items":["Т. Ман","Монкретьен","Кольбер","Юм"]},{"q":"Назовите предпосылки меркантилизма","items":["Крах феодализма и переход к товарно-денежным отношениям","Великие географические открытия («революция цен»)","Мировой рынок","Абсолютизм и нужда в деньгах на армию и флот","Мануфактуры"]},{"q":"Назовите черты меркантилизма","items":["Макроподход","Предмет — торговля, а не производство","Производительным считался труд лишь по добыче золота и серебра","Активное вмешательство государства","Протекционизм"]},{"q":"Назовите три класса физиократов","items":["Производительный (крестьяне, фермеры)","Собственники земли (аристократия, получают ренту)","Непроизводительный (ремесленники, торговцы, чиновники)"]},{"q":"Назовите три идеи физиократии","items":["Только земля/сельское хозяйство даёт «чистый продукт»","«Природный порядок» — объективные вечные законы","Минимальное вмешательство, свобода торговли, частная собственность (laissez faire); единый налог на землю"]},{"q":"Назовите представителей физиократии","items":["Ф. Кенэ","А. Тюрго","Дюпон де Немур"]},{"q":"Назовите причины упадка физиократии","items":["Французская революция 1789","Рост промышленности","Односторонность взглядов"]}],"pairs":[["Ранний меркантилизм","Поздний меркантилизм","Ранний (XVI в.) = деньги/бульонизм/запреты, активный денежный баланс; поздний (XVII в.) = торговый баланс/мануфактуры"],["Монетарная система","Мануфактурная система","Монетарная — ранний меркантилизм (запрет вывоза денег, активный денежный баланс); мануфактурная — поздний (активный торговый баланс, вывоз готовых товаров)"]],"chrono":[["Меркантилизм","XVI–XVIII вв.",1500],["«Трактат о политической экономии» Монкретьена","1615",1615],["Т. Ман, «Рассуждение о торговле Англии с Ост-Индией»","1621",1621],["Т. Ман, «Богатство Англии во внешней торговле»","1630",1630],["Навигационный акт Кромвеля","1651 (действовал до 1840)",1651],["Физиократия","1750–1789",1750],["Кенэ, «Экономическая таблица»","1758",1758],["Французская революция (упадок физиократии)","1789",1789]],"questions":[["Кто ввёл термин «политическая экономия» и когда?","Монкретьен, «Трактат о политической экономии», 1615."],["Чем ранний меркантилизм отличается от позднего?","Ранний = деньги/бульонизм/запреты (активный денежный баланс); поздний = торговый баланс/мануфактуры."],["В чём главная ошибка меркантилизма?","Богатство = золото, игнор производства."],["Кто такой «стерильный класс» у физиократов?","Ремесленники и торговцы."],["Что такое «Экономическая таблица» Кенэ?","Первая макромодель кругооборота (1758)."],["Почему «Мун» и «Ман» — одно и то же?","Это одна фамилия (Mun) в разных написаниях — Т. Ман."]]},{"n":22,"title":"II. Классическая политэкономия (конец XVII – XIX вв.)","section":"Эволюция мысли","cards":[["Классическая политэкономия: основа","Трудовая теория стоимости, принцип laissez faire, «экономический человек», отказ от протекционизма. Смена фокуса: от сферы обращения (меркантилизм) к сфере производства.","КПЭ"],["Условия зарождения КПЭ","Капитализм в Англии (фермеры-капиталисты, наёмный труд, мануфактуры); во Франции — разорение крестьян при Людовике XIV и кольбертизме.","КПЭ"],["Уильям Петти (1623–1687)","Врач, математик, статистик, картограф (Down Survey в Ирландии); основоположник английской классической школы, промежуточное положение между меркантилизмом и классикой.","Петти"],["«Труд — отец богатства, а земля — его мать»","Афоризм Петти; стоимость определяется затратами труда.","Петти"],["Две цены Петти","«Цена естественная» (стоимость) и «цена политическая» (рыночная).","Петти"],["Доходы по Петти","Зарплата = цена труда (физиологический минимум); рента = излишек над издержками в сельском хозяйстве.","Петти"],["Политическая арифметика","Метод Петти — предшественник статистики.","Петти"],["Деньги у Петти","Оценка денег ≈ 3% богатства Англии (≈250 млн ф. ст.); деньги ≠ богатство.","Петти"],["Пьер де Буагильбер (1646–1714)","Полный разрыв с меркантилизмом — «адвокат крестьянства»; богатство = масса материальных благ (прежде всего сельхоз), а не деньги.","Буагильбер"],["Деньги по Буагильберу","«Палач» и «божество» торговли; только средство обмена.","Буагильбер"],["Формула Буагильбера","«laissez faire la nature et la liberté».","Буагильбер"],["Идеи Буагильбера","Стоимость измеряется рабочим временем; равновесие при пропорциональном обмене и свободной конкуренции; реформа налогов (талья), свобода торговли зерном.","Буагильбер"],["Адам Смит (1723–1790)","«Отец экономики». Предпосылки: промышленная революция (с 1760-х), рост буржуазии, кризис меркантилизма.","Смит"],["Разделение труда (Смит)","Булавочная мануфактура: одиночка делает ≤20 булавок в день, 10 рабочих с разделёнными операциями — около 48 000 (на человека 4800 против 20 = ×240).","Смит"],["Три фактора и доходы (Смит)","Земля → рента, труд → зарплата, капитал → прибыль.","Смит"],["Невидимая рука","Индивид, преследуя свой интерес, неосознанно служит обществу; конкуренция уравновешивает спрос и предложение.","Смит"],["Государство — «ночной сторож»","По Смиту: защита прав, оборона, общественные блага; laissez-faire, свободная торговля.","Смит"],["Трудовая теория стоимости (Смит)","Стоимость определяется общественно необходимым трудом. Есть и у Смита, и у Рикардо.","Смит"],["Давид Рикардо (1772–1823)","Предмет — законы распределения доходов между рентой, прибылью и зарплатой.","Рикардо"],["Стоимость по Рикардо","Определяется количеством труда (живой + овеществлённый); рыночная цена колеблется вокруг неё.","Рикардо"],["Дифференциальная рента","Возникает из-за различий в плодородии и расположении земель; «не потому хлеб дорог, что платится рента, а рента платится потому, что хлеб дорог».","Рикардо"],["Закон убывающей доходности (плодородия)","Закон, на который опирается Рикардо при анализе ренты.","Рикардо"],["Железный закон зарплаты","Естественная цена труда = минимум на содержание семьи (влияние Мальтуса).","Рикардо"],["Прибыль по Рикардо","Тенденция нормы прибыли к снижению; обратная зависимость прибыли и зарплаты.","Рикардо"],["Теория сравнительных преимуществ","Выгодна специализация даже без абсолютных преимуществ (сукно Англии ↔ вино Португалии); основа ВТО и глобализации.","Рикардо"],["Деньги по Рикардо","Поддержка золотого стандарта; избыток бумажных денег → обесценение.","Рикардо"],["Эквивалентность Рикардо–Барро","Налоги и госдолг равнозначны (Барро, 1974).","Рикардо"],["Практика Рикардо","Депутат Палаты общин (1819–1823), борьба с «хлебными законами».","Рикардо"]],"authors":[["У. Петти","«Трактат о налогах и сборах»","Классика"],[ ША"],["Китайская модель","Социалистическая рыночная экономика: рыночные отношения под руководством КПК; смешанная собственность; государство прямо вмешивается; ставка на инвестиции, экспорт и промышленность.","Китай"],["Особые экономические зоны Китая","В презентации — 140+; самая известная — Шэньчжэнь; экспортная ориентация, «мировая фабрика».","Китай"],["Структура ВВП Китая по презентации","Промышленность ≈50%, услуги ≈35%, АПК ≈15% (упрощённые данные; сейчас услуги больше половины ВВП).","Китай"],["Проблемы Китая","Диспропорции регионов (до 14 раз), экология (убытки до 10% ВВП), перепроизводство, низкая зарплата. Новый курс: внутреннее потребление, рыночное регулирование, сбалансированная торговля.","Китай"],["Французская модель","Смешанная, «государство-стратег»: смешанная экономика, государство-стратег и акционер (Агентство гос. участий 2004; Bpifrance 2012), сильная соцзащита (SMIC), правила ЕС.","Франция"],["Дирижизм во Франции","1944–1973: национализация, индикативное планирование (Ж. Монне), «Тридцать славных лет» (~6% роста).","Франция"],["Правила ЕС (Маастрихт)","Дефицит ≤3%, долг ≤60% ВВП.","Франция"],["Проблемы Франции","Долг (≈119% ВВП в 2026), дефицит ≈5%, политическая нестабильность.","Франция"],["Сингапурская модель","Авторитарный капитализм, «чудо» Ли Куан Ю: 1965 — независимость; нет ресурсов; безработица 14%. Ли Куан Ю у власти 1959–1990; ПНД, меритократия, прагматизм.","Сингапур"],["Индустриализация Сингапура","Экспортно-ориентированная индустриализация вместо импортозамещения; привлечение ТНК; EDB — «одно окно»; налоговые каникулы для «пионеров индустрии».","Сингапур"],["Борьба с коррупцией в Сингапуре","БРК подчинено премьеру; высокие оклады чиновников; презумпция виновности при необъяснимом богатстве.","Сингапур"],["Жильё в Сингапуре","HDB, 90% населения — собственники жилья.","Сингапур"],["Уроки Сингапура","Первичность институтов, ресурсное «проклятие» не приговор, инвестиции в человека, гибрид госкапитализма.","Сингапур"],["Швейцарская модель","Рынок при сильных институтах: федеративное государство с 1848; федерализм и децентрализация, прямая демократия, автономия кантонов и коммун.","Швейцария"],["Структура экономики Швейцарии","Услуги ≈74%, промышленность ≈25%, с/х <1%. Ядро — малые и средние предприятия, ЕС — главный торговый партнёр.","Швейцария"],["«Тормоз долга»","Бюджетное правило Швейцарии, низкий госдолг.","Швейцария"],["Шведская модель","Социально ориентированная рыночная экономика: рынок + свободное предпринимательство + высокие налоги (≈41% ВВП) + развитая соцзащита. НЕ социализм: преобладает частная собственность, цены рыночные, планирование ограничено.","Швеция"],["Баланс участников шведской модели","Государство, работники (сильные профсоюзы), работодатели; коллективные договоры.","Швеция"],["Модель Рена–Мейднера","≈1950–51: солидарная политика зарплат, активная политика занятости, ограничительная макрополитика.","Швеция"],["Сальтшёбаденское соглашение","1938, соглашение профсоюзов LO и работодателей SAF — «классовый мир» в Швеции.","Швеция"],["Корректные названия шведской модели","Социально ориентированная рыночная экономика, социальное государство, скандинавская модель.","Швеция"],["Плюсы и минусы шведской модели","Плюсы: низкое неравенство, высокая защищённость, человеческий капитал. Минусы: налоговая нагрузка, большой госсектор, дорогой труд, жильё, безработица.","Швеция"],["Вывод о моделях","Нет единой универсальной модели для всех стран.","Общее"]],"authors":[["Ли Куан Ю","сингапурская модель (у власти 1959–1990)","Сингапур"],["Дэн Сяопин","реформы 1978 («политика четырёх модернизаций»)","Китай"],["Ж. Монне","индикативное планирование во Франции","Франция"],["Холл и Соскис","классификация LME против CME","США"],["М. Альбер","«неоамериканская» против «рейнской» модели","США"]],"lists":[{"q":"Назовите 6 признаков американской модели","items":["частная собственность","конкуренция (закон Шермана 1890)","фондовый рынок вместо банков","гибкий рынок труда","ограниченное перераспределение,
